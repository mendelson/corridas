name: Pipeline de Dados

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # quatro vezes ao dia: 00:00, 06:00, 12:00 e 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Only one data-pipeline run at a time, and it is always the most recent one.
# Commits made by the pipeline itself carry [skip ci] so they don't re-trigger.
concurrency:
  group: data-pipeline
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung source/Playwright/geocode fails fast instead of
    # riding GitHub's 6h default. The reconcile link-recheck, geocoding and
    # image-enrichment phases are each wall-clock bounded in scraper/main.py, so
    # a healthy steady-state run finishes in a fraction of this. The headroom
    # (120) covers a cold catch-up run after data has gone stale, when every
    # per-run budget is hit back to back.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m scraper.main 2>&1 | tee scraper.log

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7

      - name: Project slim JSON to web folder
        run: python scripts/generate_web_data.py

      # Regenerate the sitemap so its <lastmod> tracks this data refresh.
      - name: Regenerate sitemap
        run: python scripts/generate_sitemap.py

      # Refresh the pre-rendered event list + JSON-LD in the language shells.
      - name: Regenerate pre-rendered content
        run: python scripts/generate_prerender.py

      # Quality gate: the freshly scraped data must pass the full test suite
      # before it can land on main. If it fails, the commit step below never
      # runs, so main keeps the last known-good corridas.json and the failure
      # is surfaced loudly instead of silently shipping bad data.
      - name: Validate scraped data
        run: python -m pytest tests/ -q

      # A main exige checks obrigatórios (ruleset): o pipeline entrega os dados
      # via PR com auto-merge em vez de push direto. O assunto do squash leva
      # [skip ci] para não redisparar o pipeline (mesmo mecanismo de antes).
      - name: Commit updated data via PR
        env:
          # PAT do mantenedor: PRs criadas com o github.token não disparam
          # workflows, então os required checks nunca reportariam.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scraper.log data/last-scraper.log
          git add data/corridas.json web/corridas.json web/corridas-boot.json web/sitemap.xml web/pt/index.html web/en/index.html web/es/index.html web/de/index.html web/fr/index.html data/last-scraper.log data/geo_cache.json data/majors_cache.json data/finishers_horarios.json data/historico/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          [ -z "${{ secrets.AUTOMERGE_PAT }}" ] && echo "::warning::AUTOMERGE_PAT ausente — usando github.token (checks não rodarão na PR de dados)."
          STAMP=$(date -u +%Y-%m-%d)
          BRANCH="data/scrape-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: atualiza corridas $STAMP"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          # PRs de scrape anteriores ainda abertas estão supersedidas — fechar.
          for old in $(gh pr list --state open --json number,headRefName \
                         -q '.[] | select(.headRefName | startswith("data/scrape-")) | .number'); do
            gh pr close "$old" -c "Superseded pelo scrape mais recente." -d || true
          done
          gh pr create --base main --head "$BRANCH" \
            --title "chore: atualiza corridas $STAMP" \
            --body "PR automática do pipeline de dados — merge automático quando os checks passarem. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            -t "chore: atualiza corridas $STAMP [skip ci]" -b "" \
            || gh pr merge "$BRANCH" --squash --delete-branch \
                 -t "chore: atualiza corridas $STAMP [skip ci]" -b ""
