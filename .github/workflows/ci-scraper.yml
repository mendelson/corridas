name: CI — Validar Scrapers

# Triggered automatically on PRs that add or modify scraper source files OR
# shared scraper infrastructure (pipeline, models, http client).
#
# Also triggered on direct pushes to fix/** and claude/** branches (scraper
# paths only) so that branches with merge conflicts can still get validated
# without needing a clean merge commit.
#
# workflow_dispatch lets you run the validate job manually from the Actions UI
# against any branch, passing an optional comma-separated list of sources.
#
# When only source files change: runs only the affected sources (selective mode).
# When infra files change: runs ALL sources — the pipeline must be validated end-
# to-end against every source so regressions in main.py/models.py are caught here
# rather than after merge via data-pipeline.
#
# Note: does not commit the rescrape output back to the branch — the branch's
# corridas.json is not modified.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scraper/sources/**'
      - 'scraper/main.py'
      - 'scraper/models.py'
      - 'scraper/http_client.py'
      - 'scraper/utils.py'
      - 'scraper/playwright_client.py'
  push:
    branches:
      - 'fix/**'
      - 'claude/**'
    paths:
      - 'scraper/sources/**'
      - 'scraper/main.py'
      - 'scraper/models.py'
      - 'scraper/http_client.py'
      - 'scraper/utils.py'
      - 'scraper/playwright_client.py'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source names to test (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

# Keep only the newest run per branch/PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Detect changed sources
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sources=${{ inputs.sources }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # For direct branch pushes, compare the pushed commit(s) against main.
            INFRA=$(git diff --name-only "origin/main...HEAD" \
              -- 'scraper/main.py' \
                 'scraper/models.py' \
                 'scraper/http_client.py' \
                 'scraper/utils.py' \
                 'scraper/playwright_client.py' 2>/dev/null || true)
            if [ -n "$INFRA" ]; then
              echo "Infra changed — running all sources"
              echo "sources=" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only "origin/main...HEAD" \
                -- 'scraper/sources/*.py' 'scraper/sources/majors/*.py' \
                | grep -v '__init__\.py' \
                | sed 's|scraper/sources/||; s|\.py$||' \
                | tr '\n' ',' | sed 's/,$//')
              echo "Detected changed sources: $CHANGED"
              echo "sources=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          else
            # PR event — existing logic.
            # If shared infra changed, run ALL sources (empty SCRAPER_SOURCES = all).
            INFRA=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- 'scraper/main.py' \
                 'scraper/models.py' \
                 'scraper/http_client.py' \
                 'scraper/utils.py' \
                 'scraper/playwright_client.py')

            if [ -n "$INFRA" ]; then
              echo "Infra changed (${INFRA//$'\n'/, }) — running all sources"
              echo "sources=" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                -- 'scraper/sources/*.py' 'scraper/sources/majors/*.py' \
                | grep -v '__init__\.py' \
                | sed 's|scraper/sources/||; s|\.py$||' \
                | tr '\n' ',' | sed 's/,$//')
              echo "Detected changed sources: $CHANGED"
              echo "sources=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run scraper
        env:
          SCRAPER_SOURCES: ${{ steps.detect.outputs.sources }}
          SCRAPESTACK_KEY: ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -o pipefail
          python -m scraper.main 2>&1 | tee rescrape.log

      - name: Copy to web
        run: cp data/corridas.json web/corridas.json

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: rescrape.log
          retention-days: 7

      - name: Run site tests
        run: python -m pytest tests/ -v --tb=short
