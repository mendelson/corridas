<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria — Mateus Mendelson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0f1115; color: #fff; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    header { padding: 38px 28px 16px; max-width: 1100px; margin: 0 auto; animation: hdrIn .7s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes hdrIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .hrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .gactions { display: flex; align-items: center; gap: 8px; }
    .gbtn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #2a2f38; border-radius: 9px; background: #161a20; color: #aeb4c0; font-family: "Archivo", system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-decoration: none; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
    .gbtn:hover { color: #f3efe7; border-color: #454c59; background: #1b2027; }
    .gbtn-icon { font-size: 14px; line-height: 1; }
    .lang-dd { position: fixed; z-index: 9999; background: #161a20; border: 1px solid #2a2f38; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; min-width: 152px; overflow: hidden; padding: 4px; animation: ddIn .16s ease-out both; }
    @keyframes ddIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .lang-opt { background: none; border: none; border-radius: 7px; padding: 9px 12px; text-align: left; font-family: "Archivo", system-ui, sans-serif; font-size: 13px; color: #cfd4dd; cursor: pointer; transition: background .12s, color .12s; }
    .lang-opt:hover { background: #1f242c; color: #f3efe7; }
    .lang-opt.active { color: #E8C04A; font-weight: 700; }
    .overline { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; font-weight: 700; }
    h1.title { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.05; margin: 10px 0 0; letter-spacing: -.01em; color: #f3efe7; }
    .hint { font-size: 11px; color: #4a5160; margin-top: 10px; letter-spacing: .02em; }
    .scroller { overflow-x: auto; overflow-y: hidden; border-top: 1px solid #20242c; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
    .scroller::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .track { display: flex; align-items: flex-start; height: 470px; width: max-content; padding: 0 28px; }
    .sec { position: relative; height: 100%; flex: 0 0 auto; }
    .track .rv { opacity: 0; } /* hidden until revealed (animation plays once) */
    .rail { position: absolute; left: 0; right: 0; top: 235px; height: 1.5px; background: #2c323d; z-index: 0; }
    .rail.dotted { background: transparent; background-image: repeating-linear-gradient(90deg, #3a414e 0 2px, transparent 2px 6px); }
    .ylabel { position: absolute; top: 201px; font-family: "Spectral", Georgia, serif; font-size: 22px; font-weight: 500; color: #f3efe7; line-height: 1; z-index: 1; pointer-events: none; }
    .ynode { position: absolute; top: 230px; width: 11px; height: 11px; border-radius: 6px; background: #f3efe7; box-shadow: 0 0 0 4px #0f1115; z-index: 2; }
    .mtick { position: absolute; top: 236px; width: 1px; height: 5px; background: #2b313b; z-index: 0; }
    .mlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 700; letter-spacing: .04em; color: #565c68; white-space: nowrap; pointer-events: none; }
    .enode { position: absolute; top: 230.5px; width: 9px; height: 9px; border-radius: 5px; box-shadow: 0 0 0 3.5px #0f1115; z-index: 2; }
    .conn { position: absolute; width: 1.5px; background: #2c323d; z-index: 1; }
    .conn.below { top: 235px; height: 36px; }
    .conn.above { top: 199px; height: 36px; }
    .card { position: absolute; left: 16px; right: 16px; background: #181b21; border: 1px solid #262b34; border-radius: 14px; padding: 15px 16px 16px; z-index: 3; }
    .card.below { top: 271px; }
    .card.above { bottom: 271px; }
    .cmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cdate { font-size: 10px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    .ctype { font-size: 10px; letter-spacing: .12em; color: #5e6472; font-weight: 600; text-transform: uppercase; }
    .cbadge { display: inline-block; margin-top: 9px; padding: 3px 9px; border-radius: 999px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent; }
    .legend { display: flex; gap: 16px; margin-top: 13px; flex-wrap: wrap; }
    .legend .li { display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8b91a0; }
    .legend .dot { width: 9px; height: 9px; border-radius: 5px; box-shadow: 0 0 0 3px #0f1115; }
    .cname { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 17px; line-height: 1.18; margin: 6px 0 0; letter-spacing: -.005em; color: #f3efe7; }
    .cloc { font-size: 12px; color: #8b91a0; margin-top: 3px; }
    .cbtns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1 1 0; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #2f3540; border-radius: 10px; background: #1c2129; text-decoration: none; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: #465061; background: #20262f; }
    .slogo { display: inline-flex; align-items: center; gap: 5px; } .slogo svg { display: block; }
    .sword { font-weight: 700; font-size: 13px; letter-spacing: .01em; color: #FC4C02; }
    .logo-garmin { display: block; height: 14px; width: auto; fill: #1ca0e3; }
    .logo-polar { display: block; height: 13px; width: auto; }
    .gylab { position: absolute; top: 244px; transform: translateX(-50%); font-family: "Spectral", Georgia, serif; font-size: 13px; font-weight: 500; color: #4a5160; z-index: 1; pointer-events: none; }
    .gnode { position: absolute; top: 233px; width: 6px; height: 6px; border-radius: 3px; background: #2b313b; box-shadow: 0 0 0 3px #0f1115; z-index: 1; }
    /* "today" end marker — the timeline concludes here and grows over time */
    .tnode { position: absolute; top: 230px; width: 11px; height: 11px; border-radius: 6px; background: #0f1115; border: 2px solid #E4572E; box-shadow: 0 0 0 4px #0f1115; z-index: 2; }
    .tlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; letter-spacing: .1em; color: #E4572E; white-space: nowrap; z-index: 1; pointer-events: none; }
    @media (max-width: 560px) {
      header { padding: 26px 18px 14px; }
      .gbtn-lbl { display: none; }
      .gbtn { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <div class="overline">Mateus Mendelson</div>
      <nav class="gactions">
        <a class="gbtn" id="navCal" href="#"><span class="gbtn-icon" aria-hidden="true">📅</span><span class="gbtn-lbl" id="navCalLbl"></span></a>
        <a class="gbtn" id="navApps" href="https://apps.mmendelson.com" target="_blank" rel="noopener"><span class="gbtn-icon" aria-hidden="true">⌚</span><span class="gbtn-lbl">Apps</span></a>
        <button class="gbtn" id="navLang" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="gbtn-icon" aria-hidden="true">🌐</span><span class="gbtn-lbl" id="navLangLbl"></span></button>
      </nav>
    </div>
    <h1 class="title" id="title"></h1>
    <div class="hint" id="hint"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="scroller"><div class="track" id="track"></div></div>

  <script>
  (function () {
    var STR = {
      pt: { loc:"pt-BR", t:["Corridas que","marcaram o caminho"], hint:"Role para percorrer os anos →", today:"HOJE", cal:"Calendário", type:{marathon:"Maratona",half:"Meia maratona",race:"Corrida",ten:"10K"}, ms:{firstHalf:"1ª meia maratona",firstMarathon:"1ª maratona",pb:"Recorde pessoal"} },
      en: { loc:"en",    t:["Races that","shaped the journey"],    hint:"Scroll to move through the years →", today:"TODAY", cal:"Calendar", type:{marathon:"Marathon",half:"Half marathon",race:"Race",ten:"10K"}, ms:{firstHalf:"First half marathon",firstMarathon:"First marathon",pb:"Personal best"} },
      es: { loc:"es",    t:["Carreras que","marcaron el camino"],  hint:"Desplázate para recorrer los años →", today:"HOY", cal:"Calendario", type:{marathon:"Maratón",half:"Media maratón",race:"Carrera",ten:"10K"}, ms:{firstHalf:"1ª media maratón",firstMarathon:"1ª maratón",pb:"Récord personal"} },
      de: { loc:"de",    t:["Läufe, die","den Weg prägten"],       hint:"Scrollen, um durch die Jahre zu gehen →", today:"HEUTE", cal:"Kalender", type:{marathon:"Marathon",half:"Halbmarathon",race:"Lauf",ten:"10K"}, ms:{firstHalf:"Erster Halbmarathon",firstMarathon:"Erster Marathon",pb:"Persönliche Bestzeit"} },
      fr: { loc:"fr",    t:["Des courses qui","ont marqué la route"], hint:"Faites défiler pour parcourir les années →", today:"AUJOURD'HUI", cal:"Calendrier", type:{marathon:"Marathon",half:"Semi-marathon",race:"Course",ten:"10K"}, ms:{firstHalf:"Premier semi-marathon",firstMarathon:"Premier marathon",pb:"Record personnel"} },
    };
    // The gallery has a single URL and never navigates to change language —
    // the switch happens in place. The choice falls back to the browser
    // language and is remembered in localStorage (no URL change, no reload).
    var STORE_KEY="gallery_lang";
    var _saved=null; try{_saved=localStorage.getItem(STORE_KEY);}catch(e){}
    var lang=(_saved||navigator.language||"en").slice(0,2).toLowerCase(); if(!STR[lang]) lang="en";
    var T=STR[lang], LOC=T.loc;
    var mShort=[];
    function buildMonths(){ for(var i=0;i<12;i++){ mShort[i]=new Intl.DateTimeFormat(LOC,{month:"short"}).format(new Date(2021,i,1)).replace(/\./g,"").toUpperCase(); } }

    // Applies a language in place: updates every piece of chrome text and
    // re-renders the timeline (without replaying the intro). No URL change.
    function applyLang(nl){
      if(!STR[nl]) nl="en";
      lang=nl; T=STR[lang]; LOC=T.loc;
      try{localStorage.setItem(STORE_KEY, lang);}catch(e){}
      buildMonths();
      document.documentElement.lang=lang;
      document.title=({pt:"Galeria",en:"Gallery",es:"Galería",de:"Galerie",fr:"Galerie"}[lang])+" — Mateus Mendelson";
      document.getElementById("title").innerHTML=esc(T.t[0])+"<br>"+esc(T.t[1]);
      document.getElementById("hint").textContent=T.hint;
      document.getElementById("navCal").setAttribute("href","/"+lang);
      document.getElementById("navCalLbl").textContent=T.cal;
      document.getElementById("navLangLbl").textContent=lang.toUpperCase();
      draw();
    }

    // Header navigation: calendar (back to the main worldwide calendar in this
    // language), apps (Garmin/watch apps), and the in-place language switcher.
    (function wireNav(){
      var navLang=document.getElementById("navLang");
      var LABELS={pt:"Português",en:"English",es:"Español",de:"Deutsch",fr:"Français"};
      var dd=null;
      function close(){ if(dd){ dd.remove(); dd=null; navLang.setAttribute("aria-expanded","false"); } }
      navLang.addEventListener("click",function(e){
        e.stopPropagation();
        if(dd){ close(); return; }
        dd=document.createElement("div"); dd.className="lang-dd"; dd.setAttribute("role","listbox");
        var order=[lang].concat(Object.keys(LABELS).filter(function(c){return c!==lang;})
          .sort(function(a,b){return LABELS[a].localeCompare(LABELS[b]);}));
        order.forEach(function(code){
          var b=document.createElement("button");
          b.type="button"; b.className="lang-opt"+(code===lang?" active":""); b.textContent=LABELS[code];
          b.addEventListener("click",function(){ close(); if(code!==lang) applyLang(code); });
          dd.appendChild(b);
        });
        document.body.appendChild(dd);
        navLang.setAttribute("aria-expanded","true");
        var r=navLang.getBoundingClientRect();
        dd.style.top=(r.bottom+6)+"px";
        dd.style.right=(window.innerWidth-r.right)+"px";
        setTimeout(function(){ document.addEventListener("click",close,{once:true}); },0);
      });
    })();

    // Set the initial language chrome now; draw() no-ops until data has loaded.
    applyLang(lang);

    var BASE_YW=384, GW=58, CARDW=300, FILL=1.5; // ribbon ≥ FILL× viewport so it scrolls
    var OUT="cubic-bezier(.22,.61,.36,1)", BACK="cubic-bezier(.34,1.45,.5,1)";
    function clamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
    function dp(iso){var p=iso.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]};}
    function frac(p){return (p.m+(p.d-1)/31)/12;}
    function keyf(p){return p.y*400+p.m*31+p.d;}
    // Medal-honour colour code for the event dots: marathon = gold (the most
    // honourable), half marathon = silver, 10K = copper, shorter races = bronze.
    var TIER={marathon:"#E8C04A",half:"#C3CAD6",ten:"#D4A574",other:"#C0823F"};
    // Accepts either a race object (card) or a bare type string (legend). A 10K
    // is its own copper tier, whether tagged type "ten" or a "race" with km 10.
    function color(r){
      var type=(typeof r==="string")?r:(r&&r.type);
      var kmv=(r&&typeof r==="object")?r.km:null;
      if(type==="ten" || (type==="race" && kmv===10)) return TIER.ten;
      return TIER[type]||TIER.other;
    }
    function honorRank(t){return t==="marathon"?0:t==="half"?1:t==="ten"?2:3;}
    function km(v){return (typeof v==="number")?v.toLocaleString(LOC,{maximumFractionDigits:4}):v;}
    function p2(n){return (n<10?"0":"")+n;}
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    var CHEVRON='<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FC4C02" d="M11.4 2 5.4 13.9h3.55L11.4 9l2.45 4.9h3.55z"/><path fill="#FC4C02" opacity=".55" d="M13.85 13.9 11.4 18.8 8.95 13.9H6.05L11.4 24l5.35-10.1z"/></svg>';
    var GARMIN='<svg class="logo-garmin" viewBox="0 8.75 24 9" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.265 12.024a.289.289 0 0 0-.236-.146h-.182a.289.289 0 0 0-.234.146l-1.449 3.025c-.041.079.004.138.094.138h.335c.132 0 .193-.061.228-.134.037-.073.116-.234.13-.266.02-.045.083-.071.175-.071h1.559c.089 0 .148.016.175.071.018.035.098.179.136.256a.24.24 0 0 0 .234.142h.486c.089 0 .13-.069.098-.132-.034-.061-1.549-3.029-1.549-3.029zm-.914 2.224c-.089 0-.132-.067-.094-.148l.571-1.222c.039-.081.1-.081.136 0l.555 1.222c.037.081-.006.148-.096.148H5.351zm12.105-2.201v3.001c0 .083.073.138.163.138h.396c.089 0 .163-.057.163-.146v-2.998c0-.089-.059-.163-.148-.163h-.411c-.09-.001-.163.054-.163.168zm-6.631 1.88c-.051-.073-.022-.154.063-.181 0 0 .342-.102.506-.25.165-.146.246-.36.246-.636a1 1 0 0 0-.096-.457.787.787 0 0 0-.27-.303 1.276 1.276 0 0 0-.423-.171c-.165-.035-.386-.047-.386-.047a8.81 8.81 0 0 0-.325-.008H8.495a.164.164 0 0 0-.163.163v2.998c0 .089.073.146.163.146h.388c.089 0 .163-.057.163-.146v-1.193s.002 0 .002-.002l.738-.002c.089 0 .205.061.258.134l.766 1.077c.071.096.138.132.228.132h.508c.089 0 .104-.085.073-.128-.032-.038-.794-1.126-.794-1.126zm-.311-.61a1.57 1.57 0 0 1-.213.028 8.807 8.807 0 0 1-.325.006h-.763a.164.164 0 0 1-.163-.163v-.608c0-.089.073-.163.163-.163h.762c.089 0 .236.004.325.006 0 0 .114.004.213.028a.629.629 0 0 1 .24.098.358.358 0 0 1 .126.148.473.473 0 0 1 0 .374.352.352 0 0 1-.126.148.617.617 0 0 1-.239.098zm11.803-1.439c-.089 0-.163.059-.163.146v1.919c0 .089-.051.11-.114.047l-1.921-1.992a.376.376 0 0 0-.276-.118h-.362c-.114 0-.163.061-.163.122v3.068c0 .061.059.12.148.12h.362c.089 0 .152-.049.152-.132l.002-2.021c0-.089.051-.11.114-.045l2.004 2.082a.36.36 0 0 0 .279.116h.272a.164.164 0 0 0 .163-.163v-2.986a.164.164 0 0 0-.163-.163h-.334zm-7.835 1.87c-.043.079-.116.077-.159 0l-.939-1.724a.262.262 0 0 0-.236-.146h-.51a.164.164 0 0 0-.163.163v2.996c0 .089.059.15.163.15h.317c.089 0 .154-.057.154-.142 0-.041.002-2.179.004-2.179.004 0 1.173 2.177 1.173 2.177a.105.105 0 0 0 .189 0s1.179-2.173 1.181-2.173c.004 0 .002 2.11.002 2.173 0 .087.069.142.159.142h.364c.089 0 .163-.045.163-.163V12.04a.164.164 0 0 0-.163-.163h-.488a.265.265 0 0 0-.244.142l-.967 1.729zM0 13.529c0 1.616 1.653 1.697 1.984 1.697 1.098 0 1.561-.297 1.58-.309a.29.29 0 0 0 .152-.264v-1.116a.186.186 0 0 0-.187-.187H2.151c-.104 0-.171.083-.171.187v.116c0 .104.067.187.171.187h.797a.14.14 0 0 1 .14.14v.52c-.157.065-.874.274-1.451.136-.836-.199-.901-.89-.901-1.096 0-.173.053-1.043 1.079-1.13.831-.071 1.378.264 1.384.268.098.051.199.014.254-.089l.104-.209c.043-.085.028-.175-.077-.246-.006-.004-.59-.319-1.494-.319C.055 11.813 0 13.354 0 13.529zm22.134-2.478h-2.165c-.079 0-.148-.039-.187-.108s-.039-.146 0-.215l1.084-1.874a.21.21 0 0 1 .187-.108.21.21 0 0 1 .187.108l1.084 1.874a.203.203 0 0 1 0 .215.22.22 0 0 1-.19.108zm1.488 3.447c.207 0 .378.169.378.378a.379.379 0 0 1-.378.378.379.379 0 0 1-.378-.378.38.38 0 0 1 .378-.378zm.002.7c.173 0 .305-.14.305-.321s-.13-.321-.305-.321-.307.14-.307.321c0 .18.13.321.307.321zm-.146-.543h.169c.102 0 .152.041.152.124 0 .071-.045.122-.114.122l.126.195h-.077l-.124-.195h-.061v.195h-.073v-.441h.002zm.073.189h.085c.055 0 .091-.012.091-.069 0-.051-.045-.065-.091-.065h-.085v.134z"/></svg>';
    function deviceBtn(name,url){
      var mark=name==="Garmin"?GARMIN:'<img class="logo-polar" src="polar-logo.png" alt="'+esc(name)+'">';
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="'+esc(name)+'">'+mark+'</a>';
    }
    function stravaBtn(url){
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="Strava"><span class="slogo">'+CHEVRON+'<span class="sword">Strava</span></span></a>';
    }
    function cardHTML(r,ex,p,side,loc,sw){
      var c=color(r);
      // Fixed-width card centred on the event, clamped inside the year column so
      // it never spills past the column edges; the connector still meets it.
      var cl=clamp(ex-CARDW/2, 6, Math.max(6, sw-CARDW-6));
      if(ex<cl+12) cl=Math.max(0,ex-12); else if(ex>cl+CARDW-12) cl=ex-CARDW+12;
      return '<span class="enode" style="left:'+(ex-4.5)+'px;background:'+c+'"></span>'+
        '<span class="conn '+side+'" style="left:'+ex+'px"></span>'+
        '<div class="card '+side+'" style="left:'+cl+'px;width:'+CARDW+'px;right:auto">'+
        '<div class="cmeta"><span class="cdate" style="color:'+c+'">'+esc(p2(p.d)+" "+mShort[p.m])+'</span>'+
        '<span class="ctype">'+esc((T.type[r.type]||r.type)+" · "+km(r.km)+" KM")+'</span></div>'+
        '<h2 class="cname">'+esc(r.name)+'</h2>'+
        '<div class="cloc">'+esc(loc||r.city)+'</div>'+
        ((r.milestone && T.ms && T.ms[r.milestone]) ? '<div><span class="cbadge" style="color:'+c+';background:'+c+'1f;border-color:'+c+'66">'+esc(T.ms[r.milestone])+'</span></div>' : '')+
        '<div class="cbtns">'+stravaBtn(r.strava)+deviceBtn(r.device,r.deviceUrl)+'</div></div>';
    }

    function render(RACES, LOCDATA, paises){
      RACES=(RACES||[]).filter(function(r){return r&&r.date;});
      LOCDATA=LOCDATA||{}; paises=paises||[];
      var multiCountry = paises.length>=2;
      function nrm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
      function locStr(r){
        var parts=[r.city];
        if(r.estado) parts.push(r.estado);
        var s=parts.join(" • "); // "Brasília • DF"
        if(multiCountry && r.pais){
          var ld=LOCDATA[r.pais];
          var cn; try{cn=new Intl.DisplayNames([LOC],{type:"region"}).of(r.pais);}catch(e){cn=(ld&&ld.name)||r.pais;}
          if(cn) s += " • " + cn;
        }
        return s;
      }
      var now=new Date(), curY=now.getFullYear();
      var todayFrac=(now.getMonth()+(now.getDate()-1)/31)/12;
      var asc=RACES.map(function(r){return {r:r,p:dp(r.date)};}).sort(function(a,b){return keyf(a.p)-keyf(b.p);});
      var byYear={}; asc.forEach(function(x){(byYear[x.p.y]=byYear[x.p.y]||[]).push(x);});
      var minY = asc.length ? asc[0].p.y : curY;
      if(minY>curY) minY=curY;

      // Pass 1 — lay out the columns: event-bearing/current years are full
      // columns; runs of empty years collapse into one discreet dotted gap.
      var cols=[], run=[];
      for(var y=minY; y<=curY; y++){
        var hasEv=(byYear[y]||[]).length>0, current=(y===curY);
        if(!hasEv && !current){ run.push(y); continue; }
        if(run.length){ cols.push({type:"gap",years:run}); run=[]; }
        cols.push({type:"year",y:y,current:current});
      }
      if(run.length) cols.push({type:"gap",years:run});

      // Each event-year is sized to ~fill the viewport, so the gallery opens
      // focused on the current year and you scroll back (one year ≈ one screen)
      // to reveal earlier years — whose reveal then animates as they appear.
      // The dotted gaps between event-years stay narrow/discreet.
      var clientW=scroller.clientWidth||window.innerWidth||1000;
      var yw = Math.max(BASE_YW, clientW - 48);

      // Pass 2 — build the markup with the computed year width.
      var html="", ev=0;
      cols.forEach(function(c){
        if(c.type==="gap"){
          var gw=c.years.length*GW;
          var gs='<div class="sec" style="width:'+gw+'px"><div class="rail dotted"></div>';
          c.years.forEach(function(yy,i){ var cx=i*GW+GW/2; gs+='<span class="gnode" style="left:'+(cx-3)+'px"></span><span class="gylab" style="left:'+cx+'px">'+yy+'</span>'; });
          gs+='</div>'; html+=gs; return;
        }
        var y=c.y, current=c.current;
        var tx = current ? todayFrac*yw : 0;
        var sec='<div class="sec" style="width:'+yw+'px">';
        sec+= current ? '<div class="rail" style="right:auto;width:'+tx+'px"></div>' : '<div class="rail"></div>';
        sec+='<span class="ynode" style="left:0px"></span><span class="ylabel" style="left:18px">'+y+'</span>';
        var lastM = current ? now.getMonth() : 11;
        var lastLx=-999; // track last month label x position to avoid overlaps
        for(var mi=0; mi<=lastM; mi++){
          var mx=(mi/12)*yw;
          sec+='<span class="mtick" style="left:'+mx+'px"></span>';
          // Only show month label if it's far enough from the last one (≥44px) and not too close to "today"
          if(!(current && Math.abs(mx - tx) < 26) && mx - lastLx >= 44){
            sec+='<span class="mlab" style="left:'+mx+'px">'+esc(mShort[mi])+'</span>';
            lastLx=mx;
          }
        }
        (byYear[y]||[]).forEach(function(x){ var ex=frac(x.p)*yw; var side=(ev%2===0)?"below":"above"; ev++; sec+=cardHTML(x.r,ex,x.p,side,locStr(x.r),yw); });
        if(current){ sec+='<span class="tnode" style="left:'+(tx-5.5)+'px"></span><span class="tlab" style="left:'+tx+'px">'+esc(T.today)+'</span>'; }
        sec+='</div>'; html+=sec;
      });
      document.getElementById("track").innerHTML=html;

      // Colour-code legend — only the tiers actually present, ordered by honour
      // (marathon first). Reinforces what each event dot's colour means.
      var types=Array.from(new Set(RACES.map(function(r){return r.type;}).filter(Boolean)))
        .sort(function(a,b){return honorRank(a)-honorRank(b);});
      document.getElementById("legend").innerHTML=types.map(function(t){
        return '<span class="li"><span class="dot" style="background:'+color(t)+'"></span>'+esc(T.type[t]||t)+'</span>';
      }).join("");
      // The first render's cinematic intro is kicked off from draw() (which has
      // the post-layout measurements it needs).
    }

    // Per-element entrance config, keyed off the element's class. The `rank`
    // gives a subtle within-position layering (rail under year under card); the
    // primary cascade is horizontal (past → present), handled in onReveal().
    function revealConfig(el){
      var cl=el.classList;
      if(cl.contains("rail"))  return {rank:0, dur:680, ease:OUT,  origin:"left center", kf:[{transform:"scaleX(0)"},{transform:"scaleX(1)"}]};
      if(cl.contains("ynode")||cl.contains("gnode")||cl.contains("tnode")) return {rank:1, dur:500, ease:BACK, kf:[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}]};
      if(cl.contains("ylabel")) return {rank:1, dur:520, ease:OUT, kf:[{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"translateY(0)"}]};
      if(cl.contains("gylab")||cl.contains("tlab")) return {rank:1, dur:520, ease:OUT, kf:[{opacity:0,transform:"translateX(-50%) translateY(12px)"},{opacity:1,transform:"translateX(-50%) translateY(0)"}]};
      if(cl.contains("mtick")) return {rank:2, dur:360, ease:OUT, origin:"center top", kf:[{transform:"scaleY(0)"},{transform:"scaleY(1)"}]};
      if(cl.contains("mlab"))  return {rank:2, dur:380, ease:OUT, kf:[{opacity:0,transform:"translateX(-50%) translateY(7px)"},{opacity:1,transform:"translateX(-50%) translateY(0)"}]};
      if(cl.contains("enode")) return {rank:3, dur:500, ease:BACK, kf:[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}]};
      if(cl.contains("conn"))  return {rank:4, dur:420, ease:OUT, origin:cl.contains("above")?"center bottom":"center top", kf:[{transform:"scaleY(0)"},{transform:"scaleY(1)"}]};
      if(cl.contains("card")){ var dy=cl.contains("above")?-26:26; return {rank:5, dur:640, ease:OUT, kf:[{opacity:0,transform:"translateY("+dy+"px) scale(.94)"},{opacity:1,transform:"translateY(0) scale(1)"}]}; }
      return {rank:0, dur:340, ease:OUT, kf:[{opacity:0},{opacity:1}]};
    }

    // Reveal one element with its entrance animation; returns the Animation so
    // the cinematic intro can cancel it if the user skips.
    function onReveal(el, delay){
      var c=revealConfig(el);
      if(c.origin) el.style.transformOrigin=c.origin;
      el.classList.remove("rv");
      return el.animate(c.kf, {duration:c.dur, delay:delay + c.rank*22, easing:c.ease, fill:"both"});
    }

    // --- Cinematic opening ---------------------------------------------------
    // A three-act intro plays once on load, then hands off to the standard
    // auto-advance:
    //   1. Pulled-back overview — the whole timeline fits on screen and the
    //      line, years and months draw in, oldest → newest.
    //   2. Zoom in to the oldest end.
    //   3. Accelerated pan oldest → today; each event's dot, connector and card
    //      animate in as the camera passes it.
    // The camera is a transform on the track; native scrolling is disabled
    // during the intro and restored at today for the normal drift. Any user
    // interaction skips straight to the final state.
    var _camAnims=[], _camRAF=null, _camDone=false, _skipHandlers=null;
    function endCameraNow(track, todayStart, prevOverflow){
      if(_camDone) return;
      _camDone=true;
      if(_camRAF) cancelAnimationFrame(_camRAF);
      _camAnims.forEach(function(a){ try{a.cancel();}catch(e){} });
      if(_skipHandlers){ _skipHandlers(); _skipHandlers=null; }
      var hidden=track.querySelectorAll(".rv");
      for(var i=0;i<hidden.length;i++) hidden[i].classList.remove("rv");
      track.style.transform="none"; track.style.transformOrigin=""; track.style.willChange="";
      scroller.style.overflowX=prevOverflow||"";
      scroller.scrollLeft=todayStart; pos=todayStart; dir=-1;
      setTimeout(function(){ auto=true; }, 500);
    }

    function cameraIntro(){
      var track=document.getElementById("track");
      var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var todayStart=startScroll();
      if(reduce || !("animate" in Element.prototype)){
        _camDone=true;
        scroller.scrollLeft=todayStart; pos=todayStart; dir=-1; auto=true; return;
      }
      var clientW=scroller.clientWidth||1, H=track.offsetHeight||470, M=34;
      scroller.scrollLeft=0;
      var trk=track.getBoundingClientRect();
      function cx(el){ return el.getBoundingClientRect().left - trk.left; } // content x (scale 1)
      var tnode=track.querySelector(".tnode");
      var todayX=tnode ? cx(tnode) : track.scrollWidth;
      var extent=todayX+50;                       // oldest → today (ignore empty future)
      var fit=Math.min(1, (clientW-2*M)/extent);  // scale that fits it all on screen

      var lineEls=Array.prototype.slice.call(track.querySelectorAll(".rail,.ynode,.gnode,.tnode,.ylabel,.gylab,.tlab,.mtick,.mlab"));
      var evEls=Array.prototype.slice.call(track.querySelectorAll(".enode,.conn,.card"));
      var lineMeta=lineEls.map(function(el){ return {el:el, x:cx(el)}; });
      var evMeta=evEls.map(function(el){ return {el:el, x:cx(el), done:false}; });
      lineEls.concat(evEls).forEach(function(el){ el.classList.add("rv"); });

      var prevOverflow=scroller.style.overflowX;
      scroller.style.overflowX="hidden";
      track.style.transformOrigin="0 0";
      track.style.willChange="transform";
      function camT(tx,ty,s){ return "translateX("+tx+"px) translateY("+ty+"px) scale("+s+")"; }
      var overview=camT(M, (H-H*fit)/2, fit), oldest=camT(0,0,1);
      track.style.transform=overview;

      function offSkip(){ ["wheel","pointerdown","touchstart","keydown"].forEach(function(ev){ window.removeEventListener(ev, onSkip); }); }
      function onSkip(){ endCameraNow(track, todayStart, prevOverflow); }
      _skipHandlers=offSkip;
      ["wheel","pointerdown","touchstart","keydown"].forEach(function(ev){ window.addEventListener(ev, onSkip, {passive:true}); });

      var D1=1300, D2=780, D3=2400;

      function phase1(){ // draw line/years/months oldest → newest
        return new Promise(function(res){
          lineMeta.forEach(function(m){ _camAnims.push(onReveal(m.el, (extent?m.x/extent:0)*D1)); });
          setTimeout(res, D1+650);
        });
      }
      function phase2(){ // zoom overview → oldest
        return new Promise(function(res){
          var a=track.animate([{transform:overview},{transform:oldest}], {duration:D2, easing:"cubic-bezier(.6,.02,.2,1)", fill:"both"});
          _camAnims.push(a);
          a.finished.then(function(){ try{a.commitStyles();}catch(e){ track.style.transform=oldest; } try{a.cancel();}catch(e){} res(); }, res);
        });
      }
      function phase3(){ // accelerated pan oldest → today, revealing events en route
        return new Promise(function(res){
          var t0=null;
          function frame(ts){
            if(t0==null) t0=ts;
            var p=Math.min((ts-t0)/D3, 1);
            var e=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; // easeInOutQuad
            var camLeft=e*todayStart;
            track.style.transform=camT(-camLeft,0,1);
            evMeta.forEach(function(m){
              if(!m.done && camLeft >= m.x - clientW*0.82){ m.done=true; _camAnims.push(onReveal(m.el, 0)); }
            });
            if(p<1){ _camRAF=requestAnimationFrame(frame); } else { res(); }
          }
          _camRAF=requestAnimationFrame(frame);
        });
      }

      phase1().then(function(){ if(!_camDone) return phase2(); })
              .then(function(){ if(!_camDone) return phase3(); })
              .then(function(){ if(!_camDone) endCameraNow(track, todayStart, prevOverflow); });
    }

    // --- Timeline motion -----------------------------------------------------
    var scroller=document.querySelector(".scroller");

    // Auto-advance: the journey starts parked at today (right end) and, after a
    // short beat, drifts back through time; at either end it reverses,
    // ping-ponging in a loop. Auto begins false (set true once positioned at
    // today). Any genuine user interaction pauses it; it resumes after 5s.
    var auto=false, firstDrawn=false, dir=-1, resumeTimer=null, lastTs=null, pos=0, endPos=null;
    function pauseAuto(){
      auto=false;
      if(resumeTimer) clearTimeout(resumeTimer);
      resumeTimer=setTimeout(function(){ auto=true; }, 5000);
    }
    function maxScroll(){ return scroller.scrollWidth - scroller.clientWidth; }
    function tick(ts){
      if(lastTs==null) lastTs=ts;
      var dt=Math.min((ts-lastTs)/1000, 0.05); lastTs=ts; // clamp after tab sleep
      var max=maxScroll();
      // Upper bound for auto-advance is "today" (no drifting into the empty
      // space after today); manual scrolling can still go all the way to max.
      var hi=(endPos!=null && endPos<max) ? endPos : max;
      if(auto && hi>1){
        var sp=Math.max(40, hi/20); // full traverse ~20s regardless of length
        pos += dir*sp*dt;
        if(pos>=hi){ pos=hi; dir=-1; }
        else if(pos<=0){ pos=0; dir=1; }
        scroller.scrollLeft=pos;
      } else {
        pos=scroller.scrollLeft; // stay in sync while paused / under manual control
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Vertical wheel scroll drives the horizontal timeline: down → forward
    // (toward today), up → back. Bound to the window so it works wherever the
    // cursor is, not only over the track. Horizontal trackpad deltas pass through.
    window.addEventListener("wheel", function(e){
      if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      scroller.scrollLeft += e.deltaY;
      pos=scroller.scrollLeft;
      pauseAuto();
      e.preventDefault();
    }, {passive:false});
    ["pointerdown","mousedown","touchstart","keydown"].forEach(function(evt){
      window.addEventListener(evt, pauseAuto, {passive:true});
    });

    // Load the races, then the SAME location reference the main site uses
    // (web/locations/{ISO2}.json) for each country present, so state/country
    // names come from one source of truth.
    var _data=null;
    function draw(){
      if(!_data) return;
      if(firstDrawn && !_camDone) return; // cinematic intro in progress — don't re-render under it
      var first=!firstDrawn;
      // Preserve scroll across re-renders (language switch / resize) so the view
      // doesn't jump back to the start.
      var sl=scroller?scroller.scrollLeft:0;
      render(_data.races,_data.loc,_data.paises);
      if(!scroller) return;
      endPos=startScroll(); // "today" scroll offset (auto-advance upper bound)
      if(first){
        firstDrawn=true;
        cameraIntro(); // cinematic opening; enables auto-advance at today when done
      } else {
        scroller.scrollLeft=sl; pos=sl;
      }
    }
    // Scroll offset that opens on the current year filling the viewport (its
    // column starts ~24px from the left edge); earlier years sit off-screen left
    // and are revealed by drifting/scrolling back. Falls back to max if absent.
    function startScroll(){
      var max=scroller.scrollWidth-scroller.clientWidth;
      var track=document.getElementById("track");
      var nodes=track.querySelectorAll(".ynode"); // current year = last column
      var t=nodes.length ? nodes[nodes.length-1] : null;
      if(t){
        var trk=track.getBoundingClientRect();
        var x=t.getBoundingClientRect().left - trk.left + scroller.scrollLeft; // current-year start
        return clamp(x - 24, 0, max);
      }
      return max;
    }
    var _rz=null;
    window.addEventListener("resize", function(){ if(_rz) clearTimeout(_rz); _rz=setTimeout(draw,150); });

    fetch("races.json", {cache:"no-cache"}).then(function(r){return r.json();}).then(function(RACES){
      RACES=(RACES||[]).filter(function(r){return r&&r.date;});
      var paises=Array.from(new Set(RACES.map(function(r){return r.pais;}).filter(Boolean)));
      return Promise.all(paises.map(function(pp){
        return fetch("../locations/"+pp+".json").then(function(r){return r.ok?r.json():null;})
          .then(function(j){return {p:pp,j:j};}).catch(function(){return {p:pp,j:null};});
      })).then(function(arr){
        var LOCDATA={};
        arr.forEach(function(x){ if(x.j){ var m={}; (x.j.subdivisions||[]).forEach(function(s){m[s.code]=s.name;}); LOCDATA[x.p]={subs:m,name:x.j.name}; } });
        _data={races:RACES,loc:LOCDATA,paises:paises}; draw();
      });
    }).catch(function(e){ console.error("gallery: failed to load data", e); render([], {}, []); });
  })();
  </script>
</body>
</html>
