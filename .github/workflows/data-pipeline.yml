name: Pipeline de Dados

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # quatro vezes ao dia: 00:00, 06:00, 12:00 e 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Only one data-pipeline run at a time, and it is always the most recent one.
# Commits made by the pipeline itself carry [skip ci] so they don't re-trigger.
concurrency:
  group: data-pipeline
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python -m scraper.main 2>&1 | tee scraper.log

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7

      - name: Project slim JSON to web folder
        run: python scripts/generate_web_data.py

      # Regenerate the sitemap so its <lastmod> tracks this data refresh.
      - name: Regenerate sitemap
        run: python scripts/generate_sitemap.py

      # Refresh the pre-rendered event list + JSON-LD in the language shells.
      - name: Regenerate pre-rendered content
        run: python scripts/generate_prerender.py

      # Quality gate: the freshly scraped data must pass the full test suite
      # before it can land on main. If it fails, the commit step below never
      # runs, so main keeps the last known-good corridas.json and the failure
      # is surfaced loudly instead of silently shipping bad data.
      - name: Validate scraped data
        run: python -m pytest tests/ -q

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scraper.log data/last-scraper.log
          git add data/corridas.json web/corridas.json web/corridas-boot.json web/sitemap.xml web/pt/index.html web/en/index.html web/es/index.html web/de/index.html web/fr/index.html data/last-scraper.log data/geo_cache.json data/finishers_horarios.json data/historico/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: atualiza corridas $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase -X ours origin main
            git push
          fi
