<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria — Mateus Mendelson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #0f1115;
      color: #fff;
      font-family: "Archivo", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 420px; margin: 0 auto; min-height: 100vh; }

    header { padding: 38px 28px 18px; }
    .overline {
      font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase;
      color: #6a7080; font-weight: 700;
    }
    h1.title {
      font-family: "Spectral", Georgia, serif; font-weight: 500;
      font-size: 30px; line-height: 1.05; margin: 10px 0 0;
      letter-spacing: -.01em; color: #f3efe7;
    }

    .content { position: relative; padding: 12px 28px 26px; border-top: 1px solid #20242c; }
    /* The spine: left = padding-left (28) + rail axis (16) = 44 from the content box edge. */
    .spine {
      position: absolute; left: 44px; top: 8px; bottom: 16px;
      width: 1.5px; background: linear-gradient(#2c323d, #191c22);
    }

    /* A year chapter: a fixed-height band (jan top → dec bottom). */
    .band { position: relative; }

    .railcol { flex: 0 0 34px; position: relative; }

    /* Month ruler */
    .mrow { position: absolute; left: 0; width: 34px; height: 0; }
    .tick { position: absolute; left: 12.5px; top: -0.5px; width: 7px; height: 1px; background: #2b313b; }
    .mlab { position: absolute; left: 0; top: -6px; width: 11px; text-align: right; font-weight: 700; }
    .mlab.q { font-size: 8.5px; letter-spacing: .08em; color: #565c68; }
    .mlab.s { font-size: 8px; color: #363c46; }

    /* Year marker (january) */
    .yearmark { position: absolute; top: -6px; left: 0; right: 0; display: flex; gap: 14px; align-items: center; }
    .ynode {
      position: absolute; left: 11px; top: 4px; width: 11px; height: 11px;
      border-radius: 6px; background: #f3efe7; box-shadow: 0 0 0 4px #0f1115;
    }
    .ylabel { font-family: "Spectral", Georgia, serif; font-size: 23px; color: #f3efe7; line-height: 1; font-weight: 500; }

    /* A race, positioned by month fraction */
    .race { position: absolute; left: 0; right: 0; display: flex; gap: 14px; }
    .rnode {
      position: absolute; left: 12px; top: 3px; width: 9px; height: 9px;
      border-radius: 5px; box-shadow: 0 0 0 3.5px #0f1115;
    }
    .rcontent { flex: 1; min-width: 0; }
    .rmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .rdate { font-size: 10px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    .rtype { font-size: 10px; letter-spacing: .14em; color: #5e6472; font-weight: 600; text-transform: uppercase; }
    .rname {
      font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 18px;
      line-height: 1.2; margin: 4px 0 0; letter-spacing: -.005em; color: #f3efe7;
    }
    .rloc { font-size: 12.5px; color: #8b91a0; margin-top: 3px; }

    .rlinks { display: flex; gap: 16px; margin-top: 12px; }
    .rlink {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: #dad6cd; text-decoration: none;
      border-bottom: 1px solid #363c47; padding-bottom: 2px;
      transition: color .15s, border-color .15s;
    }
    .rlink:hover { color: #fff; border-color: #4a5260; }
    .rlink svg { flex: 0 0 auto; }
    .devmark { color: #aeb4c0; font-weight: 700; letter-spacing: .07em; white-space: nowrap; }
    .devmark.polar { font-weight: 800; font-style: italic; letter-spacing: .01em; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="overline">Mateus Mendelson</div>
      <h1 class="title" id="title"></h1>
    </header>
    <div class="content">
      <div class="spine"></div>
      <div id="timeline"></div>
    </div>
  </div>

  <script>
  (function () {
    // ── Data — the existing gallery events (no new data invented). ──────────
    // Race names omit the year: the year is the timeline chapter.
    var RACES = [
      { name: "Maratona Monumental de Brasília", km: 42.195, type: "marathon",
        city: "Brasília", uf: "DF", date: "2021-10-10",
        strava: "https://strava.app.link/JjUDDOdiW3b",
        device: "Polar", deviceUrl: "https://flow.polar.com/shared/7e5a542a0ce582f18569aee920145059" },
      { name: "Maratona do Rio", km: 42.195, type: "marathon",
        city: "Rio de Janeiro", uf: "RJ", date: "2026-06-07",
        strava: "https://strava.app.link/33AyvX7hW3b",
        device: "Garmin", deviceUrl: "https://connect.garmin.com/modern/activity/23166275648" },
    ];

    // ── i18n: same 5 locales as the main site, no per-language URL. ─────────
    var STR = {
      pt: { loc: "pt-BR", title: ["Corridas que", "marcaram o caminho"], type: { marathon: "Maratona", half: "Meia" } },
      en: { loc: "en",    title: ["Races that", "shaped the journey"],    type: { marathon: "Marathon", half: "Half" } },
      es: { loc: "es",    title: ["Carreras que", "marcaron el camino"],  type: { marathon: "Maratón", half: "Media" } },
      de: { loc: "de",    title: ["Läufe, die", "den Weg prägten"],       type: { marathon: "Marathon", half: "Halbmarathon" } },
      fr: { loc: "fr",    title: ["Des courses qui", "ont marqué la route"], type: { marathon: "Marathon", half: "Semi" } },
    };
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    if (!STR[lang]) lang = "en";
    var T = STR[lang], LOC = T.loc;
    document.documentElement.lang = lang;
    document.title = ({ pt: "Galeria", en: "Gallery", es: "Galería", de: "Galerie", fr: "Galerie" }[lang]) + " — Mateus Mendelson";

    // ── Layout tokens (from the design handoff). ───────────────────────────
    var PPY = 350, CARD = 84, RX = 16, RAIL = 34;

    function dparts(iso) { var p = iso.split("-"); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
    function fracOfYear(p) { return (p.m + (p.d - 1) / 31) / 12; }
    function dateKey(p) { return p.y * 400 + p.m * 31 + p.d; }
    function distColor(t) { return t === "marathon" ? "#E4572E" : t === "half" ? "#3A7CA5" : "#2A9D5C"; }

    var _mShort = [], _mNarrow = [];
    for (var mi = 0; mi < 12; mi++) {
      var dd = new Date(2021, mi, 1);
      _mShort[mi] = new Intl.DateTimeFormat(LOC, { month: "short" }).format(dd).replace(/\./g, "").toUpperCase();
      _mNarrow[mi] = new Intl.DateTimeFormat(LOC, { month: "narrow" }).format(dd).toUpperCase();
    }
    function fmtKm(km) { return (Math.round(km * 10) / 10).toLocaleString(LOC, { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
    function pad2(n) { return (n < 10 ? "0" : "") + n; }
    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

    var STRAVA_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#FC4C02" aria-hidden="true"><path d="M11.4 2 5.4 13.9h3.55L11.4 9l2.45 4.9h3.55z"/><path d="M13.85 13.9 11.4 18.8 8.95 13.9H6.05L11.4 24l5.35-10.1z" opacity=".55"/></svg>';
    var ARROW = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4"/></svg>';
    function deviceMark(name) {
      if (name === "Polar") return '<span class="devmark polar">POLAR</span>';
      return '<span class="devmark">' + esc(name.toUpperCase()) + '</span>';
    }
    function linksHTML(r) {
      return '<div class="rlinks">' +
        '<a class="rlink" href="' + esc(r.strava) + '" target="_blank" rel="noopener noreferrer nofollow" aria-label="Strava">' + STRAVA_SVG + ' Strava ' + ARROW + '</a>' +
        '<a class="rlink" href="' + esc(r.deviceUrl) + '" target="_blank" rel="noopener noreferrer nofollow" aria-label="' + esc(r.device) + '">' + deviceMark(r.device) + ' ' + ARROW + '</a>' +
        '</div>';
    }

    // ── Build chronological year chapters. ─────────────────────────────────
    var asc = RACES.map(function (r) { return { r: r, p: dparts(r.date) }; })
      .sort(function (a, b) { return dateKey(a.p) - dateKey(b.p); });
    var groups = [];
    asc.forEach(function (x) {
      var g = groups.find(function (gr) { return gr.y === x.p.y; });
      if (g) g.items.push(x); else groups.push({ y: x.p.y, items: [x] });
    });

    var prevOverflow = 0, html = "";
    groups.forEach(function (g, gi) {
      var items = g.items.map(function (x) { return { r: x.r, p: x.p, f: fracOfYear(x.p) }; });
      var lastF = Math.max.apply(null, items.map(function (i) { return i.f; }));
      var marginTop = gi === 0 ? 2 : Math.max(16, prevOverflow);
      prevOverflow = Math.max(0, lastF * PPY + CARD - PPY) + 16;

      var band = '<div class="band" style="height:' + PPY + 'px;margin-top:' + marginTop + 'px">';
      // month ruler
      for (var mi = 0; mi < 12; mi++) {
        var top = (mi / 12) * PPY;
        var isQ = (mi % 3 === 0);
        var labTxt = isQ ? _mShort[mi] : _mNarrow[mi];
        band += '<div class="mrow" style="top:' + top + 'px">' +
          (mi !== 0 ? '<span class="tick"></span>' : '') +
          '<span class="mlab ' + (isQ ? 'q' : 's') + '">' + esc(labTxt) + '</span></div>';
      }
      // year marker
      band += '<div class="yearmark"><div class="railcol"><span class="ynode"></span></div>' +
        '<div class="ylabel">' + g.y + '</div></div>';
      // races
      items.forEach(function (it) {
        var c = distColor(it.r.type);
        var top = it.f * PPY - 6;
        var typeLabel = T.type[it.r.type] || it.r.type;
        var dateLine = pad2(it.p.d) + " " + _mShort[it.p.m];
        band += '<div class="race" style="top:' + top + 'px">' +
          '<div class="railcol"><span class="rnode" style="background:' + c + '"></span></div>' +
          '<div class="rcontent">' +
            '<div class="rmeta">' +
              '<span class="rdate" style="color:' + c + '">' + esc(dateLine) + '</span>' +
              '<span class="rtype">' + esc(typeLabel) + ' · ' + esc(fmtKm(it.r.km)) + ' KM</span>' +
            '</div>' +
            '<h2 class="rname">' + esc(it.r.name) + '</h2>' +
            '<div class="rloc">' + esc(it.r.city) + ' · ' + esc(it.r.uf) + '</div>' +
            linksHTML(it.r) +
          '</div></div>';
      });
      band += '</div>';
      html += band;
    });

    document.getElementById("timeline").innerHTML = html;

    // header title (two serif lines)
    document.getElementById("title").innerHTML = esc(T.title[0]) + "<br>" + esc(T.title[1]);
  })();
  </script>
</body>
</html>
