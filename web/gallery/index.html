<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery — Mateus Mendelson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 620px;
      margin: 3rem auto;
      padding: 0 1.5rem 4rem;
      color: #1a1a2e;
      background: #f4f6f8;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; }
    .subtitle { color: #6c757d; font-size: 0.875rem; margin: 0 0 2.5rem; }

    /* Vertical timeline: a single rail with one node per event, ordered
       oldest → newest from top to bottom. */
    .timeline { position: relative; margin: 0; padding: 0 0 0 1.75rem; list-style: none; }
    .timeline::before {
      content: ""; position: absolute; top: 0.4rem; bottom: 0.4rem;
      left: 5px; width: 2px; background: #d3dae1;
    }
    .tl-item { position: relative; padding-bottom: 2.25rem; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-item::before {
      content: ""; position: absolute; left: -1.75rem; top: 0.35rem;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; border: 2px solid #1a1a2e;
    }
    .tl-date {
      font-size: 0.8rem; font-weight: 700;
      color: #6c757d; margin-bottom: 0.5rem;
    }
    .tl-card { background: #fff; border: 1px solid #e2e6ea; border-radius: 12px; padding: 1rem 1.25rem; }
    .activity-name { font-weight: 600; font-size: 1rem; margin-bottom: 0.6rem; }
    .dist-badge {
      display: inline-block; margin-bottom: 0.85rem;
      font-size: 0.78rem; font-weight: 600; color: #3a4250;
      background: #eef1f4; border-radius: 999px; padding: 2px 10px;
    }

    .links { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    /* Each pill is a brand-logo button. */
    .links a {
      /* All pills share the exact same footprint; the logo is centered inside. */
      display: inline-flex; align-items: center; justify-content: center;
      width: 132px; height: 48px; padding: 0 14px;
      border: 1px solid #e2e6ea; border-radius: 999px; background: #fff;
      text-decoration: none; transition: box-shadow 0.15s, border-color 0.15s;
    }
    .links a:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.08); border-color: #c1c9d2; }
    .logo { display: block; width: auto; max-width: 100%; }
    .logo-strava { height: 24px; fill: #FC4C02; }
    .logo-garmin { height: 21px; fill: #007CC3; }
    .logo-polar  { height: 16px; }
  </style>
</head>
<body>

        </div>
      </div>
    </li>
  </ol>

  <script>
    // Multilingual without per-language URLs: detect the browser language and
    // localize text in place on /gallery (pt/en/es/de/fr), same set as the main
    // site. Race names stay as-is; only labels + the date format are localized.
    (function () {
      var STR = {
        pt: { subtitle: "Atividades pessoais — acesso por link direto.",
              dist: { marathon: "Maratona", half: "Meia maratona", "15": "15K", "10": "10K", "5": "5K" }, loc: "pt-BR" },
        en: { subtitle: "Personal activities — direct-link access.",
              dist: { marathon: "Marathon", half: "Half marathon", "15": "15K", "10": "10K", "5": "5K" }, loc: "en" },
        es: { subtitle: "Actividades personales — acceso por enlace directo.",
              dist: { marathon: "Maratón", half: "Media maratón", "15": "15K", "10": "10K", "5": "5K" }, loc: "es" },
        de: { subtitle: "Persönliche Aktivitäten — Zugang per Direktlink.",
              dist: { marathon: "Marathon", half: "Halbmarathon", "15": "15K", "10": "10K", "5": "5K" }, loc: "de" },
        fr: { subtitle: "Activités personnelles — accès par lien direct.",
              dist: { marathon: "Marathon", half: "Semi-marathon", "15": "15K", "10": "10K", "5": "5K" }, loc: "fr" }
      };
      var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      if (!STR[lang]) lang = "en";
      var t = STR[lang];
      document.documentElement.lang = lang;

      var sub = document.querySelector(".subtitle");
      if (sub) sub.textContent = t.subtitle;

      document.querySelectorAll("[data-date]").forEach(function (el) {
        var v = el.getAttribute("data-date");
        if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
          var p = v.split("-");
          var d = new Date(+p[0], +p[1] - 1, +p[2]);
          el.textContent = new Intl.DateTimeFormat(t.loc, { day: "numeric", month: "long", year: "numeric" }).format(d);
        } else {
          el.textContent = v; // year-only fallback until the full date is known
        }
      });

      document.querySelectorAll("[data-dist]").forEach(function (el) {
        var code = el.getAttribute("data-dist");
        el.textContent = (t.dist[code] || code);
      });
    })();
  </script>
