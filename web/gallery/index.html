<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria — Mateus Mendelson</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="any" href="../logomendi-favicon.png" />
  <link rel="apple-touch-icon" href="../logomendi-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0f1115; color: #fff; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    /* Shared horizontal gutter so the header and the full-bleed timeline always
       line up; scales with the viewport so it never glues to the edges on
       desktop nor looks like a narrow, centred mobile block. */
    :root { --gutter: clamp(18px, 3vw, 56px); }
    header { padding: 38px var(--gutter) 16px; }
    /* The chrome reveal (hdrIn) and its exact reverse (chrome-out): the header
       slides down + fades in when an intro/transition ends, and slides up + fades
       out when one starts. */
    header.chrome-in  { animation: hdrIn .7s cubic-bezier(.22,.61,.36,1) both; }
    header.chrome-out { animation: hdrIn .7s cubic-bezier(.22,.61,.36,1) reverse both; }
    /* During the cinematic intro everything outside the timeline is hidden and
       interaction is locked; the chrome fades in only once the intro concludes. */
    body.intro { overflow: hidden; touch-action: none; }
    header.hide { opacity: 0; pointer-events: none; } /* first-load intro: header starts hidden (static, no animation) */
    body.intro header { pointer-events: none; } /* locked while an intro/transition runs — opacity is driven only by chrome-in/out, so the animation never fights a static opacity:0 */
    body.intro .scroller { border-top-color: transparent; } /* no stray divider while centred */
    @keyframes hdrIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .hrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .gactions { display: flex; align-items: center; gap: 8px; }
    .gbtn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #2a2f38; border-radius: 9px; background: #161a20; color: #aeb4c0; font-family: "Archivo", system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-decoration: none; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
    .gbtn:hover { color: #f3efe7; border-color: #454c59; background: #1b2027; }
    .gbtn.active { color: #E8C04A; border-color: #4a4426; background: #1b2027; }
    .gbtn-icon { font-size: 14px; line-height: 1; }
    .lang-dd { position: fixed; z-index: 9999; background: #161a20; border: 1px solid #2a2f38; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; min-width: 152px; overflow: hidden; padding: 4px; animation: ddIn .16s ease-out both; }
    @keyframes ddIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .lang-opt { background: none; border: none; border-radius: 7px; padding: 9px 12px; text-align: left; font-family: "Archivo", system-ui, sans-serif; font-size: 13px; color: #cfd4dd; cursor: pointer; transition: background .12s, color .12s; }
    .lang-opt:hover { background: #1f242c; color: #f3efe7; }
    .lang-opt.active { color: #E8C04A; font-weight: 700; }
    .overline { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; font-weight: 700; }
    h1.title { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.05; margin: 10px 0 0; letter-spacing: -.01em; color: #f3efe7; }
    .hint { font-size: 11px; color: #4a5160; margin-top: 10px; letter-spacing: .02em; }
    /* The stage wraps the timeline + the shoe scrubber so the scrubber is always
       in-flow BELOW the cards (never overlapping them). The cinematic intro
       centres the whole stage in the viewport via this transform. */
    .stage { transition: transform .7s cubic-bezier(.22,.61,.36,1); }
    .scroller { position: relative; z-index: 1; overflow-x: auto; overflow-y: hidden; border-top: 1px solid #20242c; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
    /* Progress scrubber: the shoe is the thumb of a thin track below the
       timeline (oldest → today). It rides the track with scroll and wears
       toward today, doubling as the timeline's scroll-position indicator. */
    .shoe-track { position: relative; margin: 14px var(--gutter) 0; height: 58px; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
    .shoe-track.shown { opacity: 1; }
    /* The ground the shoe walks on — a faint lit surface that footprints fade on. */
    .shoe-track-line { position: absolute; left: 0; right: 0; top: 30px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #262d38, #3a4250 18%, #3a4250 82%, #262d38); box-shadow: 0 4px 12px -5px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.04); }
    .shoe-prints { position: absolute; left: 0; right: 0; top: 28px; height: 10px; pointer-events: none; }
    .footprint { position: absolute; width: 16px; height: 6px; border-radius: 55% 45% 45% 55% / 50%; background: #5a6477; animation: fp 2s ease-out forwards; }
    @keyframes fp { 0%{ opacity: .7; } 100%{ opacity: 0; transform: scaleY(.85); } }
    /* Dust puff kicked up around the shoe each time it lands. */
    .dust { position: absolute; top: 1px; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle, rgba(150,162,184,.55), rgba(150,162,184,0) 70%); animation: dust .6s ease-out forwards; }
    @keyframes dust { 0%{ transform: translate(0,0) scale(.4); opacity: .7; } 100%{ transform: translate(var(--dx,0), -7px) scale(1.5); opacity: 0; } }
    .shoe-lab { position: absolute; top: 38px; font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #565c68; white-space: nowrap; }
    .shoe-lab-start { left: 0; }
    .shoe-lab-end { right: 0; color: #E4572E; }
    /* Year marks along the scrubber — a small tick + year for each intermediate
       year (the oldest year and TODAY remain the prominent end labels). */
    .shoe-years { position: absolute; left: 0; right: 0; top: 0; height: 100%; }
    .shoe-yr { position: absolute; top: 38px; transform: translateX(-50%); font-size: 8px; font-weight: 700; letter-spacing: .03em; color: #4a5160; white-space: nowrap; }
    .shoe-yr::before { content: ""; position: absolute; left: 50%; top: -10px; width: 1px; height: 7px; background: #353c48; transform: translateX(-50%); }
    .shoe-stage { position: absolute; left: 0; bottom: 28px; width: clamp(54px, 6vw, 80px); transform: translateX(0); pointer-events: none; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); will-change: left, transform; }
    /* The shoe faces the scroll direction: default toe-right; flipped toe-left
       when scrolling toward the past, with a smooth turn. */
    .shoe-stage svg { width: 100%; height: auto; display: block; overflow: visible; transform-origin: 50% 50%; transition: transform .4s ease; }
    .shoe-stage.face-left svg { transform: scaleX(-1); }
    /* Idle float: the shoe rises (in SVG user units) while its ground shadow shrinks/fades. */
    @keyframes sw-float  { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-30px); } }
    @keyframes sw-shadow { 0%,100%{ transform: scaleX(1); opacity: 1; } 50%{ transform: scaleX(.82); opacity: .5; } }
    @media (prefers-reduced-motion: no-preference) {
      .shoe-stage .shoe   { animation: sw-float 3.2s ease-in-out infinite; }
      .shoe-stage .shadow { transform-box: fill-box; transform-origin: center; animation: sw-shadow 3.2s ease-in-out infinite; }
    }
    .scroller::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .track { display: flex; align-items: flex-start; height: 470px; width: max-content; padding: 0 var(--gutter); }
    .sec { position: relative; height: 100%; flex: 0 0 auto; }
    .track .rv { opacity: 0; } /* hidden until revealed (animation plays once) */
    .rail { position: absolute; left: 0; right: 0; top: 235px; height: 1.5px; background: #2c323d; z-index: 0; }
    .rail.dotted { background: transparent; background-image: repeating-linear-gradient(90deg, #3a414e 0 2px, transparent 2px 6px); }
    /* The big year number pins to the gutter while its column spans the
       viewport (driven by updateStickyYears); the halo keeps it legible when it
       rides over the rail/cards, and the high z-index keeps it on top. */
    .ylabel { position: absolute; top: 201px; font-family: "Spectral", Georgia, serif; font-size: 22px; font-weight: 500; color: #f3efe7; line-height: 1; z-index: 4; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 12px #0f1115, 0 0 7px #0f1115; }
    /* Year boundary: a slim vertical post (not a dot) so it can't be mistaken
       for an event marker. It straddles the rail at the start of each year. */
    .ynode { position: absolute; top: 222px; width: 2.5px; height: 26px; border-radius: 1.5px; background: #f3efe7; box-shadow: 0 0 0 3px #0f1115; z-index: 2; }
    .mtick { position: absolute; top: 236px; width: 1px; height: 5px; background: #2b313b; z-index: 0; }
    .mlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 700; letter-spacing: .04em; color: #565c68; white-space: nowrap; pointer-events: none; }
    /* Event markers ranked by significance (see tier()): ordinary races are
       quiet flat dots, milestone races wear a small silver medal, and marathons
       — the most honourable — wear the boldest gold medal with a soft glow. The
       JS sets only `left` (event x − half the marker's width). */
    .enode { position: absolute; border-radius: 50%; box-shadow: 0 0 0 3.5px #0f1115; z-index: 2; }
    .enode.ord  { top: 231px;   width: 8px;  height: 8px;  background: #6b7280; }
    .enode.mile { top: 229px;   width: 12px; height: 12px; background: radial-gradient(circle at 36% 30%, #eef1f6, #C3CAD6 52%, #8f98a7); box-shadow: 0 0 0 3.5px #0f1115, inset 0 0 0 1px rgba(255,255,255,.35); }
    .enode.mara { top: 227.5px; width: 15px; height: 15px; background: radial-gradient(circle at 36% 30%, #fbeaa9, #E8C04A 50%, #b07f24); box-shadow: 0 0 0 3.5px #0f1115, 0 0 11px 1px rgba(232,192,74,.5), inset 0 0 0 1px rgba(255,255,255,.4); }
    /* Straight vertical leader line from a date dot to its card. Cards are laid
       out so each one sits directly over/under its dot (the timeline stretches
       in busy stretches to make room), so the connector is always vertical. */
    .conn { position: absolute; width: 1.5px; background: #2c323d; z-index: 1; }
    .conn.below { top: 235px; height: 36px; }
    .conn.above { top: 187px; height: 48px; }
    .card { position: absolute; left: 16px; right: 16px; background: #181b21; border: 1px solid #262b34; border-radius: 13px; padding: 13px 15px 14px; z-index: 3; }
    .card.below { top: 271px; }
    .card.above { bottom: 283px; }
    /* Premium treatment for prestigious races: marathons wear a warm gold frame
       + glow, milestone races a cooler silver one; ordinary cards stay plain. */
    .card.mara { border-color: rgba(232,192,74,.5); background: linear-gradient(180deg, #211f18, #181b21 44%); box-shadow: 0 0 0 1px rgba(232,192,74,.22), 0 12px 30px -10px rgba(232,192,74,.32); }
    .card.mile { border-color: rgba(195,202,214,.42); background: linear-gradient(180deg, #1d2027, #181b21 44%); box-shadow: 0 0 0 1px rgba(195,202,214,.15), 0 12px 28px -12px rgba(195,202,214,.2); }
    .cmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cdate { font-size: 10px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    .ctype { font-size: 10px; letter-spacing: .12em; color: #5e6472; font-weight: 600; text-transform: uppercase; }
    .cbadges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .cbadge { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent; }
    .cname { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 16px; line-height: 1.18; margin: 6px 0 0; letter-spacing: -.005em; color: #f3efe7; }
    .cloc { font-size: 12px; color: #8b91a0; margin-top: 3px; }
    .cbtns { display: flex; gap: 10px; margin-top: 12px; }
    .btn { flex: 1 1 0; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #2f3540; border-radius: 9px; background: #1c2129; text-decoration: none; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: #465061; background: #20262f; }
    .slogo { display: inline-flex; align-items: center; gap: 5px; } .slogo svg { display: block; }
    .sword { font-weight: 700; font-size: 12px; letter-spacing: .01em; color: #FC4C02; }
    /* Relay events: one card, a stacked per-leg list (each leg keeps its own
       identification + its own links). No "relay" wording — the legs simply read
       as the day's efforts. */
    .legs { margin-top: 11px; display: flex; flex-direction: column; gap: 9px; }
    .legrow { border-top: 1px solid #23272f; padding-top: 9px; }
    .legrow:first-child { border-top: none; padding-top: 0; }
    .leghead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .legid { font-size: 11.5px; font-weight: 700; color: #aeb4c0; letter-spacing: .02em; }
    .legkm { font-size: 9.5px; letter-spacing: .12em; color: #5e6472; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
    .legbtns { display: flex; gap: 8px; }
    .legbtns .btn { height: 32px; }
    /* Standardise the platform marks to one bounded box so none dominates the
       button. Garmin's condensed wordmark fills the height; Polar's wide one is
       width-capped (it was ~6:1, so it sprawled at a matched height). */
    .logo-garmin { display: block; height: 13px; width: auto; max-width: 58px; fill: #1ca0e3; }
    .logo-polar { display: block; height: auto; width: auto; max-height: 13px; max-width: 54px; }
    .gylab { position: absolute; top: 244px; transform: translateX(-50%); font-family: "Spectral", Georgia, serif; font-size: 13px; font-weight: 500; color: #4a5160; z-index: 1; pointer-events: none; }
    .gnode { position: absolute; top: 233px; width: 6px; height: 6px; border-radius: 3px; background: #2b313b; box-shadow: 0 0 0 3px #0f1115; z-index: 1; }
    /* Discreet yearly-distance info card — low emphasis vs the race cards. */
    .ykm { position: absolute; z-index: 1; pointer-events: none; white-space: nowrap; font-size: 10px; font-weight: 600; letter-spacing: .02em; color: #6b7280; background: rgba(20,23,29,.72); border: 1px solid #20242c; border-radius: 7px; padding: 2.5px 7px; }
    /* "today" end marker — the timeline concludes here and grows over time */
    .tnode { position: absolute; top: 230px; width: 11px; height: 11px; border-radius: 6px; background: #0f1115; border: 2px solid #E4572E; box-shadow: 0 0 0 4px #0f1115; z-index: 2; }
    .tlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; letter-spacing: .1em; color: #E4572E; white-space: nowrap; z-index: 1; pointer-events: none; }
    @media (max-width: 560px) {
      header { padding-top: 26px; padding-bottom: 14px; } /* gutter via --gutter */
      .gbtn-lbl { display: none; }
      .gbtn { padding: 0 9px; }
    }
  </style>
</head>
<body class="intro">
  <header class="hide">
    <div class="hrow">
      <div class="overline">Mateus Mendelson</div>
      <nav class="gactions">
        <a class="gbtn" id="navCal" href="#"><span class="gbtn-icon" aria-hidden="true">📅</span><span class="gbtn-lbl" id="navCalLbl"></span></a>
        <a class="gbtn" id="navApps" href="https://apps.mmendelson.com" target="_blank" rel="noopener"><span class="gbtn-icon" aria-hidden="true">⌚</span><span class="gbtn-lbl">Apps</span></a>
        <button class="gbtn" id="navView" type="button" aria-pressed="false"><span class="gbtn-icon" aria-hidden="true">★</span><span class="gbtn-lbl" id="navViewLbl"></span></button>
        <button class="gbtn" id="navZoom" type="button" aria-label="Reset view" title="Reset zoom &amp; scroll"><span class="gbtn-icon" aria-hidden="true">↺</span></button>
        <button class="gbtn" id="navLang" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="gbtn-icon" aria-hidden="true">🌐</span><span class="gbtn-lbl" id="navLangLbl"></span></button>
      </nav>
    </div>
    <h1 class="title" id="title"></h1>
    <div class="hint" id="hint"></div>
  </header>
  <div class="stage" id="stage">
    <div class="scroller"><div class="track" id="track"></div></div>
    <div class="shoe-track" id="shoeTrack" aria-hidden="true">
      <span class="shoe-track-line"></span>
      <div class="shoe-prints" id="shoePrints"></div>
      <div class="shoe-years" id="shoeYears"></div>
      <span class="shoe-lab shoe-lab-start" id="shoeLabStart"></span>
      <span class="shoe-lab shoe-lab-end" id="shoeLabEnd"></span>
      <div class="shoe-stage" id="shoeStage"></div>
    </div>
  </div>

  <script src="shoe-wear.js"></script>
  <script>
  (function () {
    var STR = {
      pt: { loc:"pt-BR", t:["Corridas que","marcaram o caminho"], hint:"Role para percorrer os anos →", today:"HOJE", cal:"Calendário", type:{marathon:"Maratona",half:"Meia maratona",race:"Corrida",ten:"10K"}, ms:{marathon:"Maratona",firstHalf:"1ª meia maratona",firstMarathon:"1ª maratona",pb:"Recorde pessoal"}, hl:"Destaques", hlT:"Mostrar só maratonas e marcos" },
      en: { loc:"en",    t:["Races that","shaped the journey"],    hint:"Scroll to move through the years →", today:"TODAY", cal:"Calendar", type:{marathon:"Marathon",half:"Half marathon",race:"Race",ten:"10K"}, ms:{marathon:"Marathon",firstHalf:"First half marathon",firstMarathon:"First marathon",pb:"Personal best"}, hl:"Highlights", hlT:"Show only marathons & milestones" },
      es: { loc:"es",    t:["Carreras que","marcaron el camino"],  hint:"Desplázate para recorrer los años →", today:"HOY", cal:"Calendario", type:{marathon:"Maratón",half:"Media maratón",race:"Carrera",ten:"10K"}, ms:{marathon:"Maratón",firstHalf:"1ª media maratón",firstMarathon:"1ª maratón",pb:"Récord personal"}, hl:"Destacados", hlT:"Mostrar solo maratones e hitos" },
      de: { loc:"de",    t:["Läufe, die","den Weg prägten"],       hint:"Scrollen, um durch die Jahre zu gehen →", today:"HEUTE", cal:"Kalender", type:{marathon:"Marathon",half:"Halbmarathon",race:"Lauf",ten:"10K"}, ms:{marathon:"Marathon",firstHalf:"Erster Halbmarathon",firstMarathon:"Erster Marathon",pb:"Persönliche Bestzeit"}, hl:"Höhepunkte", hlT:"Nur Marathons & Meilensteine zeigen" },
      fr: { loc:"fr",    t:["Des courses qui","ont marqué la route"], hint:"Faites défiler pour parcourir les années →", today:"AUJOURD'HUI", cal:"Calendrier", type:{marathon:"Marathon",half:"Semi-marathon",race:"Course",ten:"10K"}, ms:{marathon:"Marathon",firstHalf:"Premier semi-marathon",firstMarathon:"Premier marathon",pb:"Record personnel"}, hl:"Temps forts", hlT:"Afficher seulement marathons et jalons" },
    };
    // The gallery has a single URL and never navigates to change language —
    // the switch happens in place. The choice falls back to the browser
    // language and is remembered in localStorage (no URL change, no reload).
    var STORE_KEY="gallery_lang";
    var _saved=null; try{_saved=localStorage.getItem(STORE_KEY);}catch(e){}
    var lang=(_saved||navigator.language||"en").slice(0,2).toLowerCase(); if(!STR[lang]) lang="en";
    var T=STR[lang], LOC=T.loc;
    // View mode: "all" (full timeline) or "highlights" (only marathons + milestone
    // races). Persisted; the timeline re-renders and collapses/extends to fit.
    // The gallery always opens showing ONLY the highlights; the full set is
    // revealed by pressing the highlights button (with the expand transition).
    // The choice is intentionally NOT persisted — every load starts at highlights.
    var viewMode="highlights";
    var mShort=[];
    function buildMonths(){ for(var i=0;i<12;i++){ mShort[i]=new Intl.DateTimeFormat(LOC,{month:"short"}).format(new Date(2021,i,1)).replace(/\./g,"").toUpperCase(); } }

    // Applies a language in place: updates every piece of chrome text and
    // re-renders the timeline (without replaying the intro). No URL change.
    function applyLang(nl){
      if(!STR[nl]) nl="en";
      lang=nl; T=STR[lang]; LOC=T.loc;
      try{localStorage.setItem(STORE_KEY, lang);}catch(e){}
      buildMonths();
      document.documentElement.lang=lang;
      document.title=({pt:"Galeria",en:"Gallery",es:"Galería",de:"Galerie",fr:"Galerie"}[lang])+" — Mateus Mendelson";
      document.getElementById("title").innerHTML=esc(T.t[0])+"<br>"+esc(T.t[1]);
      document.getElementById("hint").textContent=T.hint;
      document.getElementById("navCal").setAttribute("href","/"+lang);
      document.getElementById("navCalLbl").textContent=T.cal;
      document.getElementById("navLangLbl").textContent=lang.toUpperCase();
      var _nv=document.getElementById("navView");
      if(_nv){
        var _nvl=document.getElementById("navViewLbl"); if(_nvl) _nvl.textContent=T.hl;
        _nv.title=T.hlT; _nv.setAttribute("aria-label",T.hlT);
        _nv.classList.toggle("active", viewMode==="highlights");
        _nv.setAttribute("aria-pressed", viewMode==="highlights"?"true":"false");
      }
      draw();
    }

    // Header navigation: calendar (back to the main worldwide calendar in this
    // language), apps (Garmin/watch apps), and the in-place language switcher.
    (function wireNav(){
      var navLang=document.getElementById("navLang");
      var LABELS={pt:"Português",en:"English",es:"Español",de:"Deutsch",fr:"Français"};
      var dd=null;
      function close(){ if(dd){ dd.remove(); dd=null; navLang.setAttribute("aria-expanded","false"); } }
      navLang.addEventListener("click",function(e){
        e.stopPropagation();
        if(dd){ close(); return; }
        dd=document.createElement("div"); dd.className="lang-dd"; dd.setAttribute("role","listbox");
        var order=[lang].concat(Object.keys(LABELS).filter(function(c){return c!==lang;})
          .sort(function(a,b){return LABELS[a].localeCompare(LABELS[b]);}));
        order.forEach(function(code){
          var b=document.createElement("button");
          b.type="button"; b.className="lang-opt"+(code===lang?" active":""); b.textContent=LABELS[code];
          b.addEventListener("click",function(){ close(); if(code!==lang) applyLang(code); });
          dd.appendChild(b);
        });
        document.body.appendChild(dd);
        navLang.setAttribute("aria-expanded","true");
        var r=navLang.getBoundingClientRect();

          for(var i=0;i<gl.length;i++){
            var Y2=parseInt(gl[i].textContent,10); if(isNaN(Y2)) continue;
            var c=gn[i]?(cx(gn[i])+cw(gn[i])/2):cx(gl[i]);
            slot[Y2]={left:c-GW/2, w:GW}; if(Y2<minY)minY=Y2; if(Y2>maxY)maxY=Y2;
          }
        }
      });
      var t=track.querySelector(".tnode");
      var todayX=t?cx(t):(trk.width||1);
      return {slot:slot, minY:minY, maxY:maxY, todayX:todayX, extent:todayX+50};
    }

    // Highlights toggle — an in-place FLIP morph. Highlights is a strict SUBSET of
    // "all", so toggling is a continuous reflow, not a re-draw: every shared card /
    // dot / tick glides by real translation from its old spot to its new spot
    // (continuous by construction — no scaleX rubber-banding), rails interpolate
    // their width, the camera stays put (today is pinned so history concertinas
    // toward / away from it), removed cards fade out on an overlay, and entering
    // cards ripple in, staggered outward from today.
    function toggleTransition(){
      var track=document.getElementById("track");
      var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(!track || reduce || !("animate" in Element.prototype)){
        renderView();
        var ts0=startScroll(); scroller.scrollLeft=ts0; pos=ts0; endPos=startScroll(); dir=-1; held=false; auto=true;
        showShoe(); return;
      }
      var DUR=720, EXIT=320, ENTER=480, EASE="cubic-bezier(.22,.61,.36,1)";
      _introActive=true; auto=false;            // freeze drift + lock input for the morph (chrome stays visible)
      if(resumeTimer){ clearTimeout(resumeTimer); resumeTimer=null; }
      showShoe();

      var srect=scroller.getBoundingClientRect(), vL=srect.left-80, vR=srect.right+80;

      // FIRST — screen rect of every keyed element, plus a stashed fixed-position
      // clone of each on-screen one (only used if it turns out to be exiting).
      var first={}, stash={};
      Array.prototype.forEach.call(track.querySelectorAll("[data-k]"), function(el){
        var k=el.getAttribute("data-k"), r=el.getBoundingClientRect();
        first[k]=r;
        if(r.width>0 && r.right>=vL && r.left<=vR){
          var c=el.cloneNode(true);
          c.style.position="fixed"; c.style.margin="0"; c.style.pointerEvents="none";
          c.style.left=r.left+"px"; c.style.top=r.top+"px"; c.style.right="auto"; c.style.bottom="auto";
          c.style.width=r.width+"px"; c.style.height=r.height+"px";
          stash[k]=c;
        }
      });
      var tnode0=track.querySelector(".tnode");
      var todayX0=tnode0 ? tnode0.getBoundingClientRect().left : srect.right;

      // SWAP — render the target set in place (fresh layout, no transforms).
      renderView();

      // ANCHOR — pin today's screen-x so the viewport never jumps; the rest of the
      // timeline reflows relative to it.
      var tnode1=track.querySelector(".tnode");
      if(tnode1){ scroller.scrollLeft = clamp(scroller.scrollLeft + (tnode1.getBoundingClientRect().left - todayX0), 0, maxScroll()); }
      pos=scroller.scrollLeft; endPos=startScroll();

      // LAST — screen rect of every keyed element after the swap.
      var last={};
      Array.prototype.forEach.call(track.querySelectorAll("[data-k]"), function(el){
        last[el.getAttribute("data-k")]={el:el, r:el.getBoundingClientRect()};
      });

      // Overlay that hosts the fixed-position fade-outs: both removed elements and
      // the OLD position of any survivor that travels too far to slide gracefully.
      var overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden;";
      document.body.appendChild(overlay);
      function fadeOutClone(k){
        var c=stash[k]; if(!c) return;
        overlay.appendChild(c);
        c.animate([{opacity:1, transform:"scale(1)"},{opacity:0, transform:"translateY(6px) scale(.96)"}],
                  {duration:EXIT, easing:EASE, fill:"forwards"});
      }
      setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, EXIT+90);

      var clientW=scroller.clientWidth||srect.width||1, FAR=clientW*1.1; // travel beyond this → cross-fade, not slide
      function onScreen(r){ return r.right>=srect.left-24 && r.left<=srect.right+24; }
      var maxDelay=0;
      function rippleIn(el, r){
        var dist=Math.abs(r.left - todayX0), delay=Math.min(260, dist*0.14);
        if(delay>maxDelay) maxDelay=delay;
        var up=el.classList.contains("above"), dyIn=el.classList.contains("card")?(up?-16:16):6;
        // Animate the independent `translate`/`scale` properties (NOT `transform`),
        // so each element keeps its CSS `transform` baseline (e.g. labels centred
        // with translateX(-50%)) instead of being knocked off-centre at the end.
        el.animate([{opacity:0, translate:"0 "+dyIn+"px", scale:"0.97"},{opacity:1, translate:"0 0", scale:"1"}],
                   {duration:ENTER, delay:delay, easing:EASE, fill:"both"});
      }

      // EXIT — elements absent from the target fade out where they stood.
      Object.keys(stash).forEach(function(k){ if(!last[k]) fadeOutClone(k); });

      // MOVE — survivors near the anchor FLIP (real translation, + width-scale for
      // rails) so they glide continuously; survivors that would streak across the
      // viewport (the line expands/contracts a lot) CROSS-FADE instead — old spot
      // fades out, new spot fades in — so nothing flies a long distance. Brand-new
      // elements ripple in, staggered outward from today.
      Object.keys(last).forEach(function(k){
        var L=last[k], el=L.el, lr=L.r, F=first[k];
        if(F){
          var dx=F.left-lr.left, dy=F.top-lr.top, isRail=el.classList.contains("rail");
          if(Math.abs(dx)>FAR){                 // too far to slide → cross-fade
            fadeOutClone(k);
            if(onScreen(lr)) rippleIn(el, lr);  // only animate-in the ones that land in view
            return;
          }
          var sx=(isRail && lr.width>2 && Math.abs(F.width-lr.width)>1) ? (F.width/lr.width) : 1;
          if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5 && Math.abs(sx-1)<0.002) return; // unchanged
          el.style.transformOrigin = isRail ? "left center" : "center center";
          // Use the independent `translate`/`scale` properties so a centred
          // element's `transform: translateX(-50%)` baseline is preserved.
          el.animate(
            isRail
              ? [{translate:dx+"px "+dy+"px", scale:sx+" 1"},{translate:"0px 0px", scale:"1 1"}]
              : [{translate:dx+"px "+dy+"px"},{translate:"0px 0px"}],
            {duration:DUR, easing:EASE, fill:"both"});
        } else if(onScreen(lr)){
          rippleIn(el, lr);
        }
      });

      // SETTLE — unlock; the auto-drift resumes after the usual idle delay. updateShoe
      // then eases the shoe to its scroll-derived position (today ≈ fully worn).
      setTimeout(function(){
        _introActive=false; held=false; setFace(-1);
        scheduleResume();
      }, Math.max(DUR, ENTER+maxDelay)+80);
    }

    // Load the races, then the SAME location reference the main site uses
    // (web/locations/{ISO2}.json) for each country present, so state/country
    // names come from one source of truth.
    var _data=null;
    // Render the current view (filtered by viewMode) + refresh the scrubber labels
    // and bounds. Pure DOM build with no camera/intro side effects, so both draw()
    // and the highlights-button transition reuse it.
    function renderView(){
      // Highlights view feeds render() only the medal-worthy races; render's
      // empty-year gap-collapse + density-based widths then shrink the timeline.
      var races=(viewMode==="highlights") ? _data.races.filter(isHighlight) : _data.races;
      render(races,_data.loc,_data.paises);
      // Scrubber end labels: oldest (rendered) year on the left, "today" on the right.
      var _yrs=races.map(function(r){return +String(r.date||"").slice(0,4);}).filter(Boolean);
      var _ls=document.getElementById("shoeLabStart"), _le=document.getElementById("shoeLabEnd");
      if(_ls) _ls.textContent = _yrs.length ? Math.min.apply(null,_yrs) : "";
      if(_le) _le.textContent = T.today;
      endPos=startScroll(); // "today" scroll offset (auto-advance upper bound)
      buildShoeYears();     // year ticks spaced along the scrubber
    }
    function draw(){
      if(!_data) return;
      if((firstDrawn && !_camDone) || _introActive) return; // intro / transition playing — don't re-render under it
      var first=!firstDrawn;
      // Preserve scroll across re-renders (language switch / resize) so the view
      // doesn't jump back to the start. If a re-render lands mid-zoom, convert the
      // scaled offset back to 1× space before dropping the transform.
      var sl=scroller?scroller.scrollLeft:0;
      if(_zoom!==1){ sl=sl/_zoom; _dropZoom(); } // a re-render replaces the track; drop the zoom transform
      renderView();
      if(first){
        firstDrawn=true;
        cameraIntro(); // cinematic opening; enables auto-advance at today when done
      } else {
        scroller.scrollLeft=sl; pos=sl; // language switch / resize — keep position
      }
    }
    // Rest position / auto-advance upper bound: the scroll that brings TODAY
    // into view near the right of the viewport, so the journey visibly arrives
    // at today (not at the start of the current-year column). Falls back to the
    // current-year start, then max, if the today marker is absent.
    function startScroll(){
      var max=scroller.scrollWidth-scroller.clientWidth;
      var track=document.getElementById("track");
      var trk=track.getBoundingClientRect();
      var t=track.querySelector(".tnode"); // the "today" marker
      if(t){
        var x=t.getBoundingClientRect().left - trk.left + scroller.scrollLeft; // today's content x
        return clamp(x - scroller.clientWidth*0.62, 0, max); // today sits ~62% from the left
      }
      var nodes=track.querySelectorAll(".ynode");
      var n=nodes.length ? nodes[nodes.length-1] : null;
      if(n){ var nx=n.getBoundingClientRect().left - trk.left + scroller.scrollLeft; return clamp(nx-24,0,max); }
      return max;
    }
    // Sticky year labels: each event-year's big number pins to the left gutter
    // while that year's column spans the viewport, then is carried out at the
    // year boundary — in both scroll directions. Geometry is cached here (one
    // layout read per render) so the per-frame update is pure arithmetic.
    function collectStickyYears(){
      var track=document.getElementById("track"); if(!track) return;
      _gutterPx=parseFloat(getComputedStyle(track).paddingLeft)||0;
      stickyYears=[];
      Array.prototype.forEach.call(track.querySelectorAll(".sec"), function(sec){
        var lab=sec.querySelector(".ylabel"); // event-year/current columns only (gaps have .gylab)
        if(lab) stickyYears.push({lab:lab, left:sec.offsetLeft, w:sec.offsetWidth, lw:lab.offsetWidth});
      });
    }
    // Reposition each year label for the current scroll offset. Clamping the
    // gutter's position within the column gives sticky behaviour for free: the
    // label sits at the column start until the gutter reaches it, pins to the
    // gutter through the year, then is pushed out by the column's trailing edge.
    function updateStickyYears(){
      if(!_camDone || _introActive || _zoom!==1 || !stickyYears.length) return; // cached geometry is 1× only; suspend while zoomed or during a replay transition
      var sl=scroller.scrollLeft;
      for(var i=0;i<stickyYears.length;i++){
        var s=stickyYears[i];
        var lo=18, hi=s.w-s.lw-10; if(hi<lo) hi=lo;
        var d=(sl+_gutterPx)-s.left; // where the gutter falls inside this column
        s.lab.style.left=(d<lo?lo:(d>hi?hi:d))+"px";
      }
    }
    // Year marks along the scrubber: every intermediate year between the oldest
    // (shoeLabStart) and TODAY (shoeLabEnd) gets an even-spaced tick — INCLUDING
    // years collapsed into dotted gaps (e.g. years with no highlight in the
    // highlights view), so the scrubber stays a continuous year axis. Read from
    // both event-year (.ylabel) and gap (.gylab) labels.
    function buildShoeYears(){
      var host=document.getElementById("shoeYears"); if(!host || !scroller) return;
      var track=document.getElementById("track");
      var years=[];
      if(track) Array.prototype.forEach.call(track.querySelectorAll(".ylabel,.gylab"), function(el){
        var y=parseInt(el.textContent,10); if(!isNaN(y)) years.push(y);
      });
      years.sort(function(a,b){return a-b;});
      years=years.filter(function(y,i){return i===0 || y!==years[i-1];}); // de-dup
      var n=years.length, html="";
      for(var i=1;i<n-1;i++){
        html+='<span class="shoe-yr" style="left:'+(i/(n-1)*100)+'%">'+years[i]+'</span>';
      }
      host.innerHTML=html;
    }
    var _rz=null;
    window.addEventListener("resize", function(){ if(_rz) clearTimeout(_rz); _rz=setTimeout(draw,150); });

    // Cache-bust with a per-load token. `no-cache` only *revalidates*, which a
    // CDN edge (or an old service worker) can still satisfy from a stale copy —
    // so races added since the last cached fetch never appeared. A unique URL
    // forces a real origin fetch every load, so new events show immediately.
    fetch("races.json?v=" + Date.now(), {cache:"no-cache"}).then(function(r){return r.json();}).then(function(RACES){
      RACES=(RACES||[]).filter(function(r){return r&&r.date;});
      var paises=Array.from(new Set(RACES.map(function(r){return r.pais;}).filter(Boolean)));
      return Promise.all(paises.map(function(pp){
        return fetch("../locations/"+pp+".json").then(function(r){return r.ok?r.json():null;})
          .then(function(j){return {p:pp,j:j};}).catch(function(){return {p:pp,j:null};});
      })).then(function(arr){
        var LOCDATA={};
        arr.forEach(function(x){ if(x.j){ var m={}; (x.j.subdivisions||[]).forEach(function(s){m[s.code]=s.name;}); LOCDATA[x.p]={subs:m,name:x.j.name}; } });
        _data={races:RACES,loc:LOCDATA,paises:paises}; draw();
      });
    }).catch(function(e){ console.error("gallery: failed to load data", e); render([], {}, []); finishChrome(false); });
  })();
  </script>
</body>
