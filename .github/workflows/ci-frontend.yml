name: CI — Testar Frontend

on:
  push:
    branches: [main]
  # No paths-ignore: `test` is a required status check and must report on
  # every PR (scraper-only PRs included) or they would block forever.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest run per ref. On main, successive merges collapse to the
# latest run; on a PR, pushing a new commit cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run site tests
        run: python -m pytest tests/ -v --tb=short --json-report --json-report-file=test-results.json

      - name: Update test log (main only)
        if: github.ref == 'refs/heads/main'
        run: python scripts/update_test_log.py test-results.json

      - name: Commit test log via PR (main only)
        if: github.ref == 'refs/heads/main'
        env:
          # PAT do mantenedor: PRs criadas com o github.token não disparam
          # workflows, então os required checks nunca reportariam.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/site-test-log.json
          if git diff --staged --quiet; then exit 0; fi
          [ -z "${{ secrets.AUTOMERGE_PAT }}" ] && echo "::warning::AUTOMERGE_PAT ausente — usando github.token (checks não rodarão na PR de log)."
          BRANCH="ci/test-log-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "ci: update site test log"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "ci: update site test log" \
            --body "PR automática (log de testes do site). Merge automático quando os checks passarem."
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            -t "ci: update site test log [skip ci]" -b "" \
            || gh pr merge "$BRANCH" --squash --delete-branch \
                 -t "ci: update site test log [skip ci]" -b ""
