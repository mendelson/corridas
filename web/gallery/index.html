<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria — Mateus Mendelson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0f1115; color: #fff; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    header { padding: 38px 28px 16px; max-width: 1100px; margin: 0 auto; }
    .overline { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; font-weight: 700; }
    h1.title { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.05; margin: 10px 0 0; letter-spacing: -.01em; color: #f3efe7; }
    .hint { font-size: 11px; color: #4a5160; margin-top: 10px; letter-spacing: .02em; }

    /* Horizontal, side-scrolling timeline. */
    .scroller { overflow-x: auto; overflow-y: hidden; border-top: 1px solid #20242c; -webkit-overflow-scrolling: touch; }
    .track { display: flex; align-items: flex-start; height: 300px; width: max-content; padding: 0 28px; }

    .sec { position: relative; height: 100%; flex: 0 0 auto; }
    /* the rail segment for this section (solid on event years, dotted on gaps) */
    .rail { position: absolute; left: 0; right: 0; top: 70px; height: 1.5px; background: linear-gradient(90deg, #2c323d, #2c323d); }
    .rail.dotted { background-image: repeating-linear-gradient(90deg, #3a414e 0 2px, transparent 2px 6px); background-color: transparent; }

    .ylabel { position: absolute; top: 30px; font-family: "Spectral", Georgia, serif; font-size: 23px; font-weight: 500; color: #f3efe7; line-height: 1; }
    .ynode { position: absolute; top: 65px; width: 11px; height: 11px; border-radius: 6px; background: #f3efe7; box-shadow: 0 0 0 4px #0f1115; }

    /* month ruler under the rail */
    .mtick { position: absolute; top: 71px; width: 1px; height: 6px; background: #2b313b; }
    .mlab { position: absolute; top: 80px; transform: translateX(-50%); font-size: 8.5px; font-weight: 700; letter-spacing: .06em; color: #565c68; white-space: nowrap; }

    /* the event marker on the rail + connector down to the card */
    .enode { position: absolute; top: 65px; width: 9px; height: 9px; border-radius: 5px; box-shadow: 0 0 0 3.5px #0f1115; }
    .conn { position: absolute; top: 74px; width: 1.5px; height: 36px; background: #2c323d; }

    /* event card — clearly delimited */
    .card { position: absolute; top: 108px; left: 16px; right: 16px; background: #181b21; border: 1px solid #262b34; border-radius: 14px; padding: 15px 16px 16px; }
    .cmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cdate { font-size: 10px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    .ctype { font-size: 10px; letter-spacing: .12em; color: #5e6472; font-weight: 600; text-transform: uppercase; }
    .cname { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 17px; line-height: 1.18; margin: 6px 0 0; letter-spacing: -.005em; color: #f3efe7; }
    .cloc { font-size: 12px; color: #8b91a0; margin-top: 3px; }

    /* uniform-size buttons */
    .cbtns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1 1 0; height: 44px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #2f3540; border-radius: 10px; background: #1c2129; text-decoration: none; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: #46506180; background: #20262f; }
    .slogo { display: inline-flex; align-items: center; gap: 5px; }
    .slogo svg { display: block; }
    .sword { font-weight: 700; font-size: 13px; letter-spacing: .01em; color: #FC4C02; }
    .logo-garmin { display: block; height: 14px; width: auto; fill: #1ca0e3; }
    .logo-polar { display: block; height: 13px; width: auto; }

    /* skipped-year markers */
    .gylab { position: absolute; top: 82px; transform: translateX(-50%); font-family: "Spectral", Georgia, serif; font-size: 13px; font-weight: 500; color: #4a5160; }
    .gnode { position: absolute; top: 67px; width: 6px; height: 6px; border-radius: 3px; background: #2b313b; box-shadow: 0 0 0 3px #0f1115; }
  </style>
</head>
<body>
  <header>
    <div class="overline">Mateus Mendelson</div>
    <h1 class="title" id="title"></h1>
    <div class="hint" id="hint"></div>
  </header>
  <div class="scroller"><div class="track" id="track"></div></div>

  <script>
  (function () {
    var RACES = [
      { name: "Maratona Monumental de Brasília", km: 42.195, type: "marathon",
        city: "Brasília", uf: "DF", date: "2021-10-10",
        strava: "https://strava.app.link/JjUDDOdiW3b",
        device: "Polar", deviceUrl: "https://flow.polar.com/shared/7e5a542a0ce582f18569aee920145059" },
      { name: "Maratona do Rio", km: 42.195, type: "marathon",
        city: "Rio de Janeiro", uf: "RJ", date: "2026-06-07",
        strava: "https://strava.app.link/33AyvX7hW3b",
        device: "Garmin", deviceUrl: "https://connect.garmin.com/modern/activity/23166275648" },
    ];
    var STR = {
      pt: { loc:"pt-BR", t:["Corridas que","marcaram o caminho"], hint:"Role para o lado para percorrer os anos →", type:{marathon:"Maratona",half:"Meia"} },
      en: { loc:"en",    t:["Races that","shaped the journey"],    hint:"Scroll sideways to move through the years →", type:{marathon:"Marathon",half:"Half"} },
      es: { loc:"es",    t:["Carreras que","marcaron el camino"],  hint:"Desliza al lado para recorrer los años →", type:{marathon:"Maratón",half:"Media"} },
      de: { loc:"de",    t:["Läufe, die","den Weg prägten"],       hint:"Seitlich scrollen, um durch die Jahre zu gehen →", type:{marathon:"Marathon",half:"Halbmarathon"} },
      fr: { loc:"fr",    t:["Des courses qui","ont marqué la route"], hint:"Faites défiler latéralement pour parcourir les années →", type:{marathon:"Marathon",half:"Semi"} },
    };
    var lang = (navigator.language || "en").slice(0,2).toLowerCase();
    if (!STR[lang]) lang = "en";
    var T = STR[lang], LOC = T.loc;
    document.documentElement.lang = lang;
    document.title = ({pt:"Galeria",en:"Gallery",es:"Galería",de:"Galerie",fr:"Galerie"}[lang]) + " — Mateus Mendelson";

    var YW = 384, GW = 58, RAILY = 70;
    function dp(iso){var p=iso.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]};}
    function frac(p){return (p.m + (p.d-1)/31)/12;}
    function keyf(p){return p.y*400 + p.m*31 + p.d;}
    function color(t){return t==="marathon"?"#E4572E":t==="half"?"#3A7CA5":"#2A9D5C";}
    var mShort=[]; for(var i=0;i<12;i++){mShort[i]=new Intl.DateTimeFormat(LOC,{month:"short"}).format(new Date(2021,i,1)).replace(/\./g,"").toUpperCase();}
    function km(v){return (Math.round(v*10)/10).toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});}
    function p2(n){return (n<10?"0":"")+n;}
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    var CHEVRON='<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FC4C02" d="M11.4 2 5.4 13.9h3.55L11.4 9l2.45 4.9h3.55z"/><path fill="#FC4C02" opacity=".55" d="M13.85 13.9 11.4 18.8 8.95 13.9H6.05L11.4 24l5.35-10.1z"/></svg>';
    var GARMIN='<svg class="logo-garmin" viewBox="0 8.75 24 9" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.265 12.024a.289.289 0 0 0-.236-.146h-.182a.289.289 0 0 0-.234.146l-1.449 3.025c-.041.079.004.138.094.138h.335c.132 0 .193-.061.228-.134.037-.073.116-.234.13-.266.02-.045.083-.071.175-.071h1.559c.089 0 .148.016.175.071.018.035.098.179.136.256a.24.24 0 0 0 .234.142h.486c.089 0 .13-.069.098-.132-.034-.061-1.549-3.029-1.549-3.029zm-.914 2.224c-.089 0-.132-.067-.094-.148l.571-1.222c.039-.081.1-.081.136 0l.555 1.222c.037.081-.006.148-.096.148H5.351zm12.105-2.201v3.001c0 .083.073.138.163.138h.396c.089 0 .163-.057.163-.146v-2.998c0-.089-.059-.163-.148-.163h-.411c-.09-.001-.163.054-.163.168zm-6.631 1.88c-.051-.073-.022-.154.063-.181 0 0 .342-.102.506-.25.165-.146.246-.36.246-.636a1 1 0 0 0-.096-.457.787.787 0 0 0-.27-.303 1.276 1.276 0 0 0-.423-.171c-.165-.035-.386-.047-.386-.047a8.81 8.81 0 0 0-.325-.008H8.495a.164.164 0 0 0-.163.163v2.998c0 .089.073.146.163.146h.388c.089 0 .163-.057.163-.146v-1.193s.002 0 .002-.002l.738-.002c.089 0 .205.061.258.134l.766 1.077c.071.096.138.132.228.132h.508c.089 0 .104-.085.073-.128-.032-.038-.794-1.126-.794-1.126zm-.311-.61a1.57 1.57 0 0 1-.213.028 8.807 8.807 0 0 1-.325.006h-.763a.164.164 0 0 1-.163-.163v-.608c0-.089.073-.163.163-.163h.762c.089 0 .236.004.325.006 0 0 .114.004.213.028a.629.629 0 0 1 .24.098.358.358 0 0 1 .126.148.473.473 0 0 1 0 .374.352.352 0 0 1-.126.148.617.617 0 0 1-.239.098zm11.803-1.439c-.089 0-.163.059-.163.146v1.919c0 .089-.051.11-.114.047l-1.921-1.992a.376.376 0 0 0-.276-.118h-.362c-.114 0-.163.061-.163.122v3.068c0 .061.059.12.148.12h.362c.089 0 .152-.049.152-.132l.002-2.021c0-.089.051-.11.114-.045l2.004 2.082a.36.36 0 0 0 .279.116h.272a.164.164 0 0 0 .163-.163v-2.986a.164.164 0 0 0-.163-.163h-.334zm-7.835 1.87c-.043.079-.116.077-.159 0l-.939-1.724a.262.262 0 0 0-.236-.146h-.51a.164.164 0 0 0-.163.163v2.996c0 .089.059.15.163.15h.317c.089 0 .154-.057.154-.142 0-.041.002-2.179.004-2.179.004 0 1.173 2.177 1.173 2.177a.105.105 0 0 0 .189 0s1.179-2.173 1.181-2.173c.004 0 .002 2.11.002 2.173 0 .087.069.142.159.142h.364c.089 0 .163-.045.163-.163V12.04a.164.164 0 0 0-.163-.163h-.488a.265.265 0 0 0-.244.142l-.967 1.729zM0 13.529c0 1.616 1.653 1.697 1.984 1.697 1.098 0 1.561-.297 1.58-.309a.29.29 0 0 0 .152-.264v-1.116a.186.186 0 0 0-.187-.187H2.151c-.104 0-.171.083-.171.187v.116c0 .104.067.187.171.187h.797a.14.14 0 0 1 .14.14v.52c-.157.065-.874.274-1.451.136-.836-.199-.901-.89-.901-1.096 0-.173.053-1.043 1.079-1.13.831-.071 1.378.264 1.384.268.098.051.199.014.254-.089l.104-.209c.043-.085.028-.175-.077-.246-.006-.004-.59-.319-1.494-.319C.055 11.813 0 13.354 0 13.529zm22.134-2.478h-2.165c-.079 0-.148-.039-.187-.108s-.039-.146 0-.215l1.084-1.874a.21.21 0 0 1 .187-.108.21.21 0 0 1 .187.108l1.084 1.874a.203.203 0 0 1 0 .215.22.22 0 0 1-.19.108zm1.488 3.447c.207 0 .378.169.378.378a.379.379 0 0 1-.378.378.379.379 0 0 1-.378-.378.38.38 0 0 1 .378-.378zm.002.7c.173 0 .305-.14.305-.321s-.13-.321-.305-.321-.307.14-.307.321c0 .18.13.321.307.321zm-.146-.543h.169c.102 0 .152.041.152.124 0 .071-.045.122-.114.122l.126.195h-.077l-.124-.195h-.061v.195h-.073v-.441h.002zm.073.189h.085c.055 0 .091-.012.091-.069 0-.051-.045-.065-.091-.065h-.085v.134z"/></svg>';
    function deviceBtn(name,url){
      var mark = name==="Garmin"?GARMIN:'<img class="logo-polar" src="polar-logo.png" alt="Polar">';
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="'+esc(name)+'">'+mark+'</a>';
    }
    function stravaBtn(url){
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="Strava"><span class="slogo">'+CHEVRON+'<span class="sword">Strava</span></span></a>';
    }

    var asc = RACES.map(function(r){return {r:r,p:dp(r.date)};}).sort(function(a,b){return keyf(a.p)-keyf(b.p);});
    var groups=[]; asc.forEach(function(x){var g=groups.find(function(gr){return gr.y===x.p.y;}); if(g)g.items.push(x); else groups.push({y:x.p.y,items:[x]});});

    var html="", prevY=null;
    groups.forEach(function(g){
      if(prevY!==null && g.y>prevY+1){
        var ys=[]; for(var y=prevY+1;y<=g.y-1;y++) ys.push(y);
        var gwid=ys.length*GW;
        var gs='<div class="sec" style="width:'+gwid+'px"><div class="rail dotted"></div>';
        ys.forEach(function(y,i){ var cx=i*GW+GW/2; gs+='<span class="gnode" style="left:'+(cx-3)+'px"></span><span class="gylab" style="left:'+cx+'px">'+y+'</span>'; });
        gs+='</div>'; html+=gs;
      }
      var sec='<div class="sec" style="width:'+YW+'px"><div class="rail"></div>';
      sec+='<span class="ynode" style="left:0px"></span><span class="ylabel" style="left:18px">'+g.y+'</span>';
      // month ruler
      for(var mi=0;mi<12;mi++){
        var x=(mi/12)*YW;
        sec+='<span class="mtick" style="left:'+x+'px"></span>';
        if(mi%3===0) sec+='<span class="mlab" style="left:'+x+'px">'+esc(mShort[mi])+'</span>';
      }
      // events
      g.items.forEach(function(x){
        var r=x.r, c=color(r.type), ex=frac(x.p)*YW;
        sec+='<span class="enode" style="left:'+(ex-4.5)+'px;background:'+c+'"></span>';
        sec+='<span class="conn" style="left:'+ex+'px"></span>';
        sec+='<div class="card">'+
          '<div class="cmeta"><span class="cdate" style="color:'+c+'">'+esc(p2(x.p.d)+" "+mShort[x.p.m])+'</span>'+
          '<span class="ctype">'+esc((T.type[r.type]||r.type)+" · "+km(r.km)+" KM")+'</span></div>'+
          '<h2 class="cname">'+esc(r.name)+'</h2>'+
          '<div class="cloc">'+esc(r.city+" · "+r.uf)+'</div>'+
          '<div class="cbtns">'+stravaBtn(r.strava)+deviceBtn(r.device,r.deviceUrl)+'</div>'+
          '</div>';
      });
      sec+='</div>'; html+=sec;
      prevY=g.y;
    });
    document.getElementById("track").innerHTML=html;
    document.getElementById("title").innerHTML=esc(T.t[0])+"<br>"+esc(T.t[1]);
    document.getElementById("hint").textContent=T.hint;
  })();
  </script>
</body>
</html>
