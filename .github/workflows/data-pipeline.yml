name: Pipeline de Dados

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # quatro vezes ao dia: 00:00, 06:00, 12:00 e 18:00 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Only one data-pipeline run at a time, and it is always the most recent one.
# The group is a FIXED string (not github.ref): pull_request "closed" events
# carry a per-PR ref (refs/pull/<N>/merge), so a ref-based group would NOT
# coalesce two different merges. With a fixed group, a new merge (or schedule
# /dispatch) cancels the in-progress run and starts fresh, so main always ends
# up with the data and tests from the latest code.
concurrency:
  group: data-pipeline
  cancel-in-progress: true

jobs:
  scrape:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          SCRAPESTACK_KEY: ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scraper.main 2>&1 | tee scraper.log

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7

      - name: Copy JSON to web folder
        run: cp data/corridas.json web/corridas.json

      # Quality gate: the freshly scraped data must pass the full test suite
      # before it can land on main. If it fails, the commit step below never
      # runs, so main keeps the last known-good corridas.json and the failure
      # is surfaced loudly instead of silently shipping bad data.
      - name: Validate scraped data
        run: python -m pytest tests/ -q

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scraper.log data/last-scraper.log
          git add data/corridas.json web/corridas.json data/last-scraper.log data/geo_cache.json data/historico/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: atualiza corridas $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase -X ours origin main
            git push
          fi
