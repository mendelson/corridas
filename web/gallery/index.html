<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria — Mateus Mendelson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0f1115; color: #fff; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    header { padding: 38px 28px 16px; max-width: 1100px; margin: 0 auto; }
    .overline { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; font-weight: 700; }
    h1.title { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.05; margin: 10px 0 0; letter-spacing: -.01em; color: #f3efe7; }
    .hint { font-size: 11px; color: #4a5160; margin-top: 10px; letter-spacing: .02em; }
    .scroller { overflow-x: auto; overflow-y: hidden; border-top: 1px solid #20242c; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
    .scroller::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .track { display: flex; align-items: flex-start; height: 470px; width: max-content; padding: 0 28px; }
    .sec { position: relative; height: 100%; flex: 0 0 auto; }
    .rail { position: absolute; left: 0; right: 0; top: 235px; height: 1.5px; background: #2c323d; }
    .rail.dotted { background: transparent; background-image: repeating-linear-gradient(90deg, #3a414e 0 2px, transparent 2px 6px); }
    .ylabel { position: absolute; top: 201px; font-family: "Spectral", Georgia, serif; font-size: 22px; font-weight: 500; color: #f3efe7; line-height: 1; }
    .ynode { position: absolute; top: 230px; width: 11px; height: 11px; border-radius: 6px; background: #f3efe7; box-shadow: 0 0 0 4px #0f1115; }
    .mtick { position: absolute; top: 236px; width: 1px; height: 5px; background: #2b313b; }
    .mlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 700; letter-spacing: .04em; color: #565c68; white-space: nowrap; }
    .enode { position: absolute; top: 230.5px; width: 9px; height: 9px; border-radius: 5px; box-shadow: 0 0 0 3.5px #0f1115; }
    .conn { position: absolute; width: 1.5px; background: #2c323d; }
    .conn.below { top: 235px; height: 36px; }
    .conn.above { top: 199px; height: 36px; }
    .card { position: absolute; left: 16px; right: 16px; background: #181b21; border: 1px solid #262b34; border-radius: 14px; padding: 15px 16px 16px; }
    .card.below { top: 271px; }
    .card.above { bottom: 271px; }
    .cmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cdate { font-size: 10px; letter-spacing: .16em; font-weight: 700; text-transform: uppercase; }
    .ctype { font-size: 10px; letter-spacing: .12em; color: #5e6472; font-weight: 600; text-transform: uppercase; }
    .cbadge { display: inline-block; margin-top: 9px; padding: 3px 9px; border-radius: 999px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent; }
    .legend { display: flex; gap: 16px; margin-top: 13px; flex-wrap: wrap; }
    .legend .li { display: inline-flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8b91a0; }
    .legend .dot { width: 9px; height: 9px; border-radius: 5px; box-shadow: 0 0 0 3px #0f1115; }
    .cname { font-family: "Spectral", Georgia, serif; font-weight: 500; font-size: 17px; line-height: 1.18; margin: 6px 0 0; letter-spacing: -.005em; color: #f3efe7; }
    .cloc { font-size: 12px; color: #8b91a0; margin-top: 3px; }
    .cbtns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1 1 0; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #2f3540; border-radius: 10px; background: #1c2129; text-decoration: none; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: #465061; background: #20262f; }
    .slogo { display: inline-flex; align-items: center; gap: 5px; } .slogo svg { display: block; }
    .sword { font-weight: 700; font-size: 13px; letter-spacing: .01em; color: #FC4C02; }
    .logo-garmin { display: block; height: 14px; width: auto; fill: #1ca0e3; }
    .logo-polar { display: block; height: 13px; width: auto; }
    .gylab { position: absolute; top: 244px; transform: translateX(-50%); font-family: "Spectral", Georgia, serif; font-size: 13px; font-weight: 500; color: #4a5160; }
    .gnode { position: absolute; top: 233px; width: 6px; height: 6px; border-radius: 3px; background: #2b313b; box-shadow: 0 0 0 3px #0f1115; }
    /* "today" end marker — the timeline concludes here and grows over time */
    .tnode { position: absolute; top: 230px; width: 11px; height: 11px; border-radius: 6px; background: #0f1115; border: 2px solid #E4572E; box-shadow: 0 0 0 4px #0f1115; }
    .tlab { position: absolute; top: 244px; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; letter-spacing: .1em; color: #E4572E; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="overline">Mateus Mendelson</div>
    <h1 class="title" id="title"></h1>
    <div class="hint" id="hint"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="scroller"><div class="track" id="track"></div></div>

  <script>
  (function () {
    var STR = {
      pt: { loc:"pt-BR", t:["Corridas que","marcaram o caminho"], hint:"Role para percorrer os anos →", today:"HOJE", type:{marathon:"Maratona",half:"Meia maratona",race:"Corrida"}, ms:{firstHalf:"1ª meia maratona",firstMarathon:"1ª maratona",pb:"Recorde pessoal"} },
      en: { loc:"en",    t:["Races that","shaped the journey"],    hint:"Scroll to move through the years →", today:"TODAY", type:{marathon:"Marathon",half:"Half marathon",race:"Race"}, ms:{firstHalf:"First half marathon",firstMarathon:"First marathon",pb:"Personal best"} },
      es: { loc:"es",    t:["Carreras que","marcaron el camino"],  hint:"Desplázate para recorrer los años →", today:"HOY", type:{marathon:"Maratón",half:"Media maratón",race:"Carrera"}, ms:{firstHalf:"1ª media maratón",firstMarathon:"1ª maratón",pb:"Récord personal"} },
      de: { loc:"de",    t:["Läufe, die","den Weg prägten"],       hint:"Scrollen, um durch die Jahre zu gehen →", today:"HEUTE", type:{marathon:"Marathon",half:"Halbmarathon",race:"Lauf"}, ms:{firstHalf:"Erster Halbmarathon",firstMarathon:"Erster Marathon",pb:"Persönliche Bestzeit"} },
      fr: { loc:"fr",    t:["Des courses qui","ont marqué la route"], hint:"Faites défiler pour parcourir les années →", today:"AUJOURD'HUI", type:{marathon:"Marathon",half:"Semi-marathon",race:"Course"}, ms:{firstHalf:"Premier semi-marathon",firstMarathon:"Premier marathon",pb:"Record personnel"} },
    };
    var lang=(navigator.language||"en").slice(0,2).toLowerCase(); if(!STR[lang]) lang="en";
    var T=STR[lang], LOC=T.loc;
    document.documentElement.lang=lang;
    document.title=({pt:"Galeria",en:"Gallery",es:"Galería",de:"Galerie",fr:"Galerie"}[lang])+" — Mateus Mendelson";
    document.getElementById("title").innerHTML=esc(T.t[0])+"<br>"+esc(T.t[1]);
    document.getElementById("hint").textContent=T.hint;

    var BASE_YW=384, GW=58, CARDW=300, FILL=1.5; // ribbon ≥ FILL× viewport so it scrolls
    function clamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
    function dp(iso){var p=iso.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]};}
    function frac(p){return (p.m+(p.d-1)/31)/12;}
    function keyf(p){return p.y*400+p.m*31+p.d;}
    // Medal-honour colour code for the event dots: marathon = gold (the most
    // honourable), half marathon = silver, shorter races = bronze.
    var TIER={marathon:"#E8C04A",half:"#C3CAD6",other:"#C0823F"};
    function color(t){return TIER[t]||TIER.other;}
    function honorRank(t){return t==="marathon"?0:t==="half"?1:2;}
    var mShort=[]; for(var i=0;i<12;i++){mShort[i]=new Intl.DateTimeFormat(LOC,{month:"short"}).format(new Date(2021,i,1)).replace(/\./g,"").toUpperCase();}
    function km(v){return (typeof v==="number")?v.toLocaleString(LOC,{maximumFractionDigits:4}):v;}
    function p2(n){return (n<10?"0":"")+n;}
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    var CHEVRON='<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FC4C02" d="M11.4 2 5.4 13.9h3.55L11.4 9l2.45 4.9h3.55z"/><path fill="#FC4C02" opacity=".55" d="M13.85 13.9 11.4 18.8 8.95 13.9H6.05L11.4 24l5.35-10.1z"/></svg>';
    var GARMIN='<svg class="logo-garmin" viewBox="0 8.75 24 9" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.265 12.024a.289.289 0 0 0-.236-.146h-.182a.289.289 0 0 0-.234.146l-1.449 3.025c-.041.079.004.138.094.138h.335c.132 0 .193-.061.228-.134.037-.073.116-.234.13-.266.02-.045.083-.071.175-.071h1.559c.089 0 .148.016.175.071.018.035.098.179.136.256a.24.24 0 0 0 .234.142h.486c.089 0 .13-.069.098-.132-.034-.061-1.549-3.029-1.549-3.029zm-.914 2.224c-.089 0-.132-.067-.094-.148l.571-1.222c.039-.081.1-.081.136 0l.555 1.222c.037.081-.006.148-.096.148H5.351zm12.105-2.201v3.001c0 .083.073.138.163.138h.396c.089 0 .163-.057.163-.146v-2.998c0-.089-.059-.163-.148-.163h-.411c-.09-.001-.163.054-.163.168zm-6.631 1.88c-.051-.073-.022-.154.063-.181 0 0 .342-.102.506-.25.165-.146.246-.36.246-.636a1 1 0 0 0-.096-.457.787.787 0 0 0-.27-.303 1.276 1.276 0 0 0-.423-.171c-.165-.035-.386-.047-.386-.047a8.81 8.81 0 0 0-.325-.008H8.495a.164.164 0 0 0-.163.163v2.998c0 .089.073.146.163.146h.388c.089 0 .163-.057.163-.146v-1.193s.002 0 .002-.002l.738-.002c.089 0 .205.061.258.134l.766 1.077c.071.096.138.132.228.132h.508c.089 0 .104-.085.073-.128-.032-.038-.794-1.126-.794-1.126zm-.311-.61a1.57 1.57 0 0 1-.213.028 8.807 8.807 0 0 1-.325.006h-.763a.164.164 0 0 1-.163-.163v-.608c0-.089.073-.163.163-.163h.762c.089 0 .236.004.325.006 0 0 .114.004.213.028a.629.629 0 0 1 .24.098.358.358 0 0 1 .126.148.473.473 0 0 1 0 .374.352.352 0 0 1-.126.148.617.617 0 0 1-.239.098zm11.803-1.439c-.089 0-.163.059-.163.146v1.919c0 .089-.051.11-.114.047l-1.921-1.992a.376.376 0 0 0-.276-.118h-.362c-.114 0-.163.061-.163.122v3.068c0 .061.059.12.148.12h.362c.089 0 .152-.049.152-.132l.002-2.021c0-.089.051-.11.114-.045l2.004 2.082a.36.36 0 0 0 .279.116h.272a.164.164 0 0 0 .163-.163v-2.986a.164.164 0 0 0-.163-.163h-.334zm-7.835 1.87c-.043.079-.116.077-.159 0l-.939-1.724a.262.262 0 0 0-.236-.146h-.51a.164.164 0 0 0-.163.163v2.996c0 .089.059.15.163.15h.317c.089 0 .154-.057.154-.142 0-.041.002-2.179.004-2.179.004 0 1.173 2.177 1.173 2.177a.105.105 0 0 0 .189 0s1.179-2.173 1.181-2.173c.004 0 .002 2.11.002 2.173 0 .087.069.142.159.142h.364c.089 0 .163-.045.163-.163V12.04a.164.164 0 0 0-.163-.163h-.488a.265.265 0 0 0-.244.142l-.967 1.729zM0 13.529c0 1.616 1.653 1.697 1.984 1.697 1.098 0 1.561-.297 1.58-.309a.29.29 0 0 0 .152-.264v-1.116a.186.186 0 0 0-.187-.187H2.151c-.104 0-.171.083-.171.187v.116c0 .104.067.187.171.187h.797a.14.14 0 0 1 .14.14v.52c-.157.065-.874.274-1.451.136-.836-.199-.901-.89-.901-1.096 0-.173.053-1.043 1.079-1.13.831-.071 1.378.264 1.384.268.098.051.199.014.254-.089l.104-.209c.043-.085.028-.175-.077-.246-.006-.004-.59-.319-1.494-.319C.055 11.813 0 13.354 0 13.529zm22.134-2.478h-2.165c-.079 0-.148-.039-.187-.108s-.039-.146 0-.215l1.084-1.874a.21.21 0 0 1 .187-.108.21.21 0 0 1 .187.108l1.084 1.874a.203.203 0 0 1 0 .215.22.22 0 0 1-.19.108zm1.488 3.447c.207 0 .378.169.378.378a.379.379 0 0 1-.378.378.379.379 0 0 1-.378-.378.38.38 0 0 1 .378-.378zm.002.7c.173 0 .305-.14.305-.321s-.13-.321-.305-.321-.307.14-.307.321c0 .18.13.321.307.321zm-.146-.543h.169c.102 0 .152.041.152.124 0 .071-.045.122-.114.122l.126.195h-.077l-.124-.195h-.061v.195h-.073v-.441h.002zm.073.189h.085c.055 0 .091-.012.091-.069 0-.051-.045-.065-.091-.065h-.085v.134z"/></svg>';
    function deviceBtn(name,url){
      var mark=name==="Garmin"?GARMIN:'<img class="logo-polar" src="polar-logo.png" alt="'+esc(name)+'">';
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="'+esc(name)+'">'+mark+'</a>';
    }
    function stravaBtn(url){
      return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow" aria-label="Strava"><span class="slogo">'+CHEVRON+'<span class="sword">Strava</span></span></a>';
    }
    function cardHTML(r,ex,p,side,loc,sw){
      var c=color(r.type);
      // Fixed-width card centred on the event, clamped inside the year column so
      // it never spills past the column edges; the connector still meets it.
      var cl=clamp(ex-CARDW/2, 6, Math.max(6, sw-CARDW-6));
      if(ex<cl+12) cl=Math.max(0,ex-12); else if(ex>cl+CARDW-12) cl=ex-CARDW+12;
      return '<span class="enode" style="left:'+(ex-4.5)+'px;background:'+c+'"></span>'+
        '<span class="conn '+side+'" style="left:'+ex+'px"></span>'+
        '<div class="card '+side+'" style="left:'+cl+'px;width:'+CARDW+'px;right:auto">'+
        '<div class="cmeta"><span class="cdate" style="color:'+c+'">'+esc(p2(p.d)+" "+mShort[p.m])+'</span>'+
        '<span class="ctype">'+esc((T.type[r.type]||r.type)+" · "+km(r.km)+" KM")+'</span></div>'+
        '<h2 class="cname">'+esc(r.name)+'</h2>'+
        '<div class="cloc">'+esc(loc||r.city)+'</div>'+
        ((r.milestone && T.ms && T.ms[r.milestone]) ? '<div><span class="cbadge" style="color:'+c+';background:'+c+'1f;border-color:'+c+'66">'+esc(T.ms[r.milestone])+'</span></div>' : '')+
        '<div class="cbtns">'+stravaBtn(r.strava)+deviceBtn(r.device,r.deviceUrl)+'</div></div>';
    }

    function render(RACES, LOCDATA, paises){
      RACES=(RACES||[]).filter(function(r){return r&&r.date;});
      LOCDATA=LOCDATA||{}; paises=paises||[];
      var multiCountry = paises.length>=2;
      function nrm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
      function locStr(r){
        var parts=[r.city];
        var ld=LOCDATA[r.pais];
        var sub=(ld&&ld.subs)?ld.subs[r.estado]:null;
        if(sub && nrm(sub)!==nrm(r.city)) parts.push(sub);
        if(multiCountry && r.pais){
          var cn; try{cn=new Intl.DisplayNames([LOC],{type:"region"}).of(r.pais);}catch(e){cn=(ld&&ld.name)||r.pais;}
          if(cn) parts.push(cn);
        }
        return parts.filter(Boolean).join(" · ");
      }
      var now=new Date(), curY=now.getFullYear();
      var todayFrac=(now.getMonth()+(now.getDate()-1)/31)/12;
      var asc=RACES.map(function(r){return {r:r,p:dp(r.date)};}).sort(function(a,b){return keyf(a.p)-keyf(b.p);});
      var byYear={}; asc.forEach(function(x){(byYear[x.p.y]=byYear[x.p.y]||[]).push(x);});
      var minY = asc.length ? asc[0].p.y : curY;
      if(minY>curY) minY=curY;

      // Pass 1 — lay out the columns: event-bearing/current years are full
      // columns; runs of empty years collapse into one discreet dotted gap.
      var cols=[], run=[];
      for(var y=minY; y<=curY; y++){
        var hasEv=(byYear[y]||[]).length>0, current=(y===curY);
        if(!hasEv && !current){ run.push(y); continue; }
        if(run.length){ cols.push({type:"gap",years:run}); run=[]; }
        cols.push({type:"year",y:y,current:current});
      }
      if(run.length) cols.push({type:"gap",years:run});

      // Size the ribbon so it overflows the viewport (≥ FILL×) — otherwise there
      // is nothing to scroll or auto-advance. Only full years widen to fill; the
      // dotted gaps stay narrow/discreet.
      var numFull=0, numGapYears=0;
      cols.forEach(function(c){ if(c.type==="year")numFull++; else numGapYears+=c.years.length; });
      var clientW=scroller.clientWidth||window.innerWidth||1000, PAD=56;
      var naturalContent=numFull*BASE_YW+numGapYears*GW;
      var targetContent=Math.max(naturalContent, clientW*FILL - PAD);
      var yw = numFull>0 ? Math.max(BASE_YW, (targetContent - numGapYears*GW)/numFull) : BASE_YW;

      // Pass 2 — build the markup with the computed year width.
      var html="", ev=0;
      cols.forEach(function(c){
        if(c.type==="gap"){
          var gw=c.years.length*GW;
          var gs='<div class="sec" style="width:'+gw+'px"><div class="rail dotted"></div>';
          c.years.forEach(function(yy,i){ var cx=i*GW+GW/2; gs+='<span class="gnode" style="left:'+(cx-3)+'px"></span><span class="gylab" style="left:'+cx+'px">'+yy+'</span>'; });
          gs+='</div>'; html+=gs; return;
        }
        var y=c.y, current=c.current;
        var tx = current ? todayFrac*yw : 0;
        var sec='<div class="sec" style="width:'+yw+'px">';
        sec+= current ? '<div class="rail" style="right:auto;width:'+tx+'px"></div>' : '<div class="rail"></div>';
        sec+='<span class="ynode" style="left:0px"></span><span class="ylabel" style="left:18px">'+y+'</span>';
        var lastM = current ? now.getMonth() : 11;
        for(var mi=0; mi<=lastM; mi++){
          var mx=(mi/12)*yw;
          sec+='<span class="mtick" style="left:'+mx+'px"></span>';
          if(!(current && Math.abs(mx - tx) < 26)) sec+='<span class="mlab" style="left:'+mx+'px">'+esc(mShort[mi])+'</span>';
        }
        (byYear[y]||[]).forEach(function(x){ var ex=frac(x.p)*yw; var side=(ev%2===0)?"below":"above"; ev++; sec+=cardHTML(x.r,ex,x.p,side,locStr(x.r),yw); });
        if(current){ sec+='<span class="tnode" style="left:'+(tx-5.5)+'px"></span><span class="tlab" style="left:'+tx+'px">'+esc(T.today)+'</span>'; }
        sec+='</div>'; html+=sec;
      });
      document.getElementById("track").innerHTML=html;

      // Colour-code legend — only the tiers actually present, ordered by honour
      // (marathon first). Reinforces what each event dot's colour means.
      var types=Array.from(new Set(RACES.map(function(r){return r.type;}).filter(Boolean)))
        .sort(function(a,b){return honorRank(a)-honorRank(b);});
      document.getElementById("legend").innerHTML=types.map(function(t){
        return '<span class="li"><span class="dot" style="background:'+color(t)+'"></span>'+esc(T.type[t]||t)+'</span>';
      }).join("");
    }

    // --- Timeline motion -----------------------------------------------------
    var scroller=document.querySelector(".scroller");

    // Auto-advance: once loaded the timeline drifts forward on its own; at the
    // far end it reverses, ping-ponging in a loop. Any genuine user interaction
    // (wheel, drag, touch, key) pauses it; it resumes after 5s of no interaction.
    var auto=true, dir=1, resumeTimer=null, lastTs=null, pos=0;
    function pauseAuto(){
      auto=false;
      if(resumeTimer) clearTimeout(resumeTimer);
      resumeTimer=setTimeout(function(){ auto=true; }, 5000);
    }
    function maxScroll(){ return scroller.scrollWidth - scroller.clientWidth; }
    function tick(ts){
      if(lastTs==null) lastTs=ts;
      var dt=Math.min((ts-lastTs)/1000, 0.05); lastTs=ts; // clamp after tab sleep
      var max=maxScroll();
      if(auto && max>1){
        var sp=Math.max(40, max/20); // full traverse ~20s regardless of length
        pos += dir*sp*dt;
        if(pos>=max){ pos=max; dir=-1; }
        else if(pos<=0){ pos=0; dir=1; }
        scroller.scrollLeft=pos;
      } else {
        pos=scroller.scrollLeft; // stay in sync while paused / under manual control
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Vertical wheel scroll drives the horizontal timeline: down → forward
    // (toward today), up → back. Bound to the window so it works wherever the
    // cursor is, not only over the track. Horizontal trackpad deltas pass through.
    window.addEventListener("wheel", function(e){
      if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      scroller.scrollLeft += e.deltaY;
      pos=scroller.scrollLeft;
      pauseAuto();
      e.preventDefault();
    }, {passive:false});
    ["pointerdown","mousedown","touchstart","keydown"].forEach(function(evt){
      window.addEventListener(evt, pauseAuto, {passive:true});
    });

    // Load the races, then the SAME location reference the main site uses
    // (web/locations/{ISO2}.json) for each country present, so state/country
    // names come from one source of truth.
    var _data=null;
    function draw(){ if(_data) render(_data.races,_data.loc,_data.paises); }
    var _rz=null;
    window.addEventListener("resize", function(){ if(_rz) clearTimeout(_rz); _rz=setTimeout(draw,150); });

    fetch("races.json", {cache:"no-cache"}).then(function(r){return r.json();}).then(function(RACES){
      RACES=(RACES||[]).filter(function(r){return r&&r.date;});
      var paises=Array.from(new Set(RACES.map(function(r){return r.pais;}).filter(Boolean)));
      return Promise.all(paises.map(function(pp){
        return fetch("../locations/"+pp+".json").then(function(r){return r.ok?r.json():null;})
          .then(function(j){return {p:pp,j:j};}).catch(function(){return {p:pp,j:null};});
      })).then(function(arr){
        var LOCDATA={};
        arr.forEach(function(x){ if(x.j){ var m={}; (x.j.subdivisions||[]).forEach(function(s){m[s.code]=s.name;}); LOCDATA[x.p]={subs:m,name:x.j.name}; } });
        _data={races:RACES,loc:LOCDATA,paises:paises}; draw();
      });
    }).catch(function(e){ console.error("gallery: failed to load data", e); render([], {}, []); });
  })();
  </script>
</body>
</html>
