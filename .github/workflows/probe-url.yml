name: Probe URL

# Quick API probe for source discovery.
#
# TWO ways to trigger:
#
# 1. Manual (workflow_dispatch) — fill in inputs via the GitHub UI.
#
# 2. Autonomous loop — push probe-config.json to the `probe` branch.
#    The workflow runs and commits probe-output/result.md back to the same
#    branch so Claude can git pull and read the results without human copy-paste.
#
#    probe-config.json format (single probe):
#      {"url": "https://...", "method": "GET", "params": {}, "body": null, "headers": {}}
#
#    probe-config.json format (multiple probes in one run):
#      [
#        {"url": "https://...", "method": "GET"},
#        {"url": "https://...", "method": "POST", "body": {"query": "..."}}
#      ]

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to probe'
        required: true
        type: string
      method:
        description: 'HTTP method'
        required: false
        default: 'GET'
        type: choice
        options: [GET, POST]
      params:
        description: 'Query params (JSON object, e.g. {"page":1,"per_page":5})'
        required: false
        default: ''
        type: string
      body:
        description: 'POST body (JSON object, e.g. {"query":"...","variables":{}})'
        required: false
        default: ''
        type: string
      headers:
        description: 'Extra headers (JSON object, e.g. {"Authorization":"Bearer token"})'
        required: false
        default: ''
        type: string
  push:
    branches: [probe]
    paths: ['probe-config.json']

permissions:
  contents: write

jobs:
  probe:
    name: Probe URL(s)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Install playwright only when running a scraper source test
          python3 -c "
          import json, sys
          try:
              cfg = json.load(open('probe-config.json'))
              needs = isinstance(cfg, dict) and 'source' in cfg
          except: needs = False
          sys.exit(0 if needs else 1)
          " && playwright install chromium --with-deps || true

      - name: Run probe (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          SCRAPESTACK_KEY:      ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN:          ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/probe_url.py \
            "${{ inputs.url }}" \
            "${{ inputs.method }}" \
            '${{ inputs.params }}' \
            '${{ inputs.body }}' \
            '${{ inputs.headers }}' \
            2>&1 | tee probe-output/result.md

      - name: Run probe (probe-config.json)
        if: github.event_name == 'push'
        env:
          SCRAPESTACK_KEY:      ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN:          ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p probe-output
          # If probe-config.json has {"source": "..."}, run scraper test.
          # Otherwise run URL probe as usual.
          SOURCE=$(python3 -c "
          import json, sys
          try:
              cfg = json.load(open('probe-config.json'))
              if isinstance(cfg, dict) and 'source' in cfg:
                  print(cfg['source'])
          except: pass
          ")
          if [ -n "$SOURCE" ]; then
            echo "=== scraper test: $SOURCE ===" | tee probe-output/result.md
            python -m scraper.test_source "$SOURCE" 2>&1 | tee -a probe-output/result.md
          else
            python scripts/probe_url.py --config probe-config.json \
              2>&1 | tee probe-output/result.md
          fi

      - name: Commit result back to probe branch
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-output/result.md probe-output/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "probe result: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -X ours origin probe
            git push origin probe
          fi

      - name: Upload full response (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-response
          path: probe-output/
          retention-days: 3
