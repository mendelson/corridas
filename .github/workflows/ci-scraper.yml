name: CI — Validar Scrapers

# Triggered automatically on PRs that add or modify scraper source files.
# Runs the affected sources, then validates the output with the full test suite.
# Both steps must pass before the PR can be merged.
#
# Note: does not commit the rescrape output back to the branch — the branch's
# corridas.json is not modified.  Use the "Re-scrape Sources" workflow manually
# to update the data after the PR is merged (or before, if needed).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scraper/sources/**'

permissions:
  contents: read

jobs:
  validate:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Detect changed sources
        id: detect
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            -- 'scraper/sources/*.py' 'scraper/sources/majors/*.py' \
            | grep -v '__init__\.py' \
            | sed 's|scraper/sources/||; s|\.py$||' \
            | tr '\n' ',' | sed 's/,$//')
          echo "Detected changed sources: $CHANGED"
          echo "sources=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run selective scraper
        env:
          SCRAPER_SOURCES: ${{ steps.detect.outputs.sources }}
          SCRAPESTACK_KEY: ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -o pipefail
          python -m scraper.main 2>&1 | tee rescrape.log

      - name: Copy to web
        run: cp data/corridas.json web/corridas.json

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: rescrape.log
          retention-days: 7

      - name: Run site tests
        run: python -m pytest tests/ -v --tb=short
