name: CI — Validar Scrapers

# Triggered automatically on PRs that add or modify scraper source files OR
# shared scraper infrastructure (pipeline, models, http client).
#
# Also triggered on direct pushes to fix/** and claude/** branches (scraper
# paths only) so that branches with merge conflicts can still get validated
# without needing a clean merge commit.
#
# workflow_dispatch lets you run the validate job manually from the Actions UI
# against any branch, passing an optional comma-separated list of sources.
#
# When only source files change: runs only the affected sources (selective mode).
# When infra files change: runs ALL sources — the pipeline must be validated end-
# to-end against every source so regressions in main.py/models.py are caught here
# rather than after merge via data-pipeline.
#
# Note: does not commit the rescrape output back to the branch — the branch's
# corridas.json is not modified.

on:
  # No paths filter on pull_request: `validate` is a REQUIRED status check, and
  # a required check that never reports blocks the PR forever. The `changes`
  # gate job below skips the heavy validation on PRs that don't touch scraper
  # code — a skipped job satisfies required status checks.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'fix/**'
      - 'claude/**'
    paths:
      - 'scraper/sources/**'
      - 'scraper/main.py'
      - 'scraper/models.py'
      - 'scraper/http_client.py'
      - 'scraper/utils.py'
      - 'scraper/playwright_client.py'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source names to test (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

# Keep only the newest run per branch/PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap PR gate: did this PR touch scraper code at all? Uses the PR files
  # API (paginated) instead of a full-history checkout.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      scraper: ${{ steps.diff.outputs.scraper }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          token, repo, pr = os.environ["GH_TOKEN"], os.environ["REPO"], os.environ["PR"]
          pat = re.compile(r"^scraper/(sources/|main\.py|models\.py|http_client\.py|utils\.py|playwright_client\.py)")
          hit, page = False, 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{pr}/files?per_page=100&page={page}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json"})
              files = json.load(urllib.request.urlopen(req))
              if any(pat.match(f["filename"]) for f in files):
                  hit = True
                  break
              if len(files) < 100:
                  break
              page += 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"scraper={'true' if hit else 'false'}\n")
          print("scraper changed:", hit)
          PY

  validate:
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (!github.event.pull_request.draft && needs.changes.outputs.scraper == 'true')
      )
    runs-on: ubuntu-latest
    # Hard ceiling: a hung source/Playwright/geocode must fail fast, never ride
    # GitHub's 6h default and pin the runner for hours. The Nominatim per-run
    # budget keeps the geocoding phase bounded so a healthy run fits comfortably.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # Cache the downloaded Chromium build (~150 MB). Key includes both reqs
      # files since either can move the pinned Playwright version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}

      - name: Install Playwright browsers
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Detect changed sources
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sources=${{ inputs.sources }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # For direct branch pushes, compare the pushed commit(s) against main.
            INFRA=$(git diff --name-only "origin/main...HEAD" \
              -- 'scraper/main.py' \
                 'scraper/models.py' \
                 'scraper/http_client.py' \
                 'scraper/utils.py' \
                 'scraper/playwright_client.py' 2>/dev/null || true)
            if [ -n "$INFRA" ]; then
              echo "Infra changed — running all sources"
              echo "sources=" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only "origin/main...HEAD" \
                -- 'scraper/sources/*.py' 'scraper/sources/evento_unico/*.py' \
                | grep -v '__init__\.py' \
                | sed 's|scraper/sources/||; s|\.py$||' \
                | tr '\n' ',' | sed 's/,$//')
              echo "Detected changed sources: $CHANGED"
              echo "sources=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          else
            # PR event — existing logic.
            # If shared infra changed, run ALL sources (empty SCRAPER_SOURCES = all).
            INFRA=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- 'scraper/main.py' \
                 'scraper/models.py' \
                 'scraper/http_client.py' \
                 'scraper/utils.py' \
                 'scraper/playwright_client.py')

            if [ -n "$INFRA" ]; then
              echo "Infra changed (${INFRA//$'\n'/, }) — running all sources"
              echo "sources=" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                -- 'scraper/sources/*.py' 'scraper/sources/evento_unico/*.py' \
                | grep -v '__init__\.py' \
                | sed 's|scraper/sources/||; s|\.py$||' \
                | tr '\n' ',' | sed 's/,$//')
              echo "Detected changed sources: $CHANGED"
              echo "sources=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run scraper
        env:
          SCRAPER_SOURCES: ${{ steps.detect.outputs.sources }}
        run: |
          set -o pipefail
          python -m scraper.main 2>&1 | tee rescrape.log

      # Mirror the data pipeline: web copy is the slim projection (+ boot
      # shard), and the pre-rendered shells must match the fresh corridas.json
      # or the SEO tests fail on stale titles.
      - name: Project slim JSON to web folder
        run: python scripts/generate_web_data.py

      - name: Regenerate pre-rendered content
        run: python scripts/generate_prerender.py

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: rescrape.log
          retention-days: 7

      - name: Run site tests
        run: python -m pytest tests/ -n auto --tb=short
