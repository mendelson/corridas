name: Scrape Corridas

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # quatro vezes ao dia: 00:00, 06:00, 12:00 e 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          SCRAPESTACK_KEY: ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scraper.main 2>&1 | tee scraper.log

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7

      - name: Copy JSON to web folder
        run: cp data/corridas.json web/corridas.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scraper.log data/last-scraper.log
          git add data/corridas.json web/corridas.json data/last-scraper.log data/geo_cache.json data/historico/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: atualiza corridas $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase -X ours origin main
            git push
          fi
