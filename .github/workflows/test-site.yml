name: Test Site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run site tests
        run: python -m pytest tests/ -v --tb=short --json-report --json-report-file=test-results.json

      - name: Update test log (main only)
        if: github.ref == 'refs/heads/main'
        run: python scripts/update_test_log.py test-results.json

      - name: Commit test log (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/site-test-log.json
          git diff --staged --quiet || (git commit -m "ci: update site test log [skip ci]" && git pull --rebase -X ours && git push)
