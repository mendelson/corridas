name: Test Branch Source

# Lightweight test workflow for feature branches — runs a single source test
# on push to claude/** branches. Removed before or after merge to main.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scraper/sources/tf_sports.py'
      - '.github/workflows/test-branch.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Test tf_sports
        env:
          SCRAPESTACK_KEY: ${{ secrets.SCRAPESTACK_KEY }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scraper.test_source tf_sports
