name: CI — Testar Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

# TEMPORARY (branch-only): replaced by the img-diag survey with git-based
# result delivery. Never merged to main.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run img diag
        run: python scripts/run_imgdiag.py

      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag-result.json diag-shot-*.png
          git commit -m "diag result [skip ci]"
          git push
