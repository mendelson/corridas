<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Favoritas — Mateus Mendelson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 620px;
      margin: 3rem auto;
      padding: 0 1.5rem 4rem;
      color: #1a1a2e;
      background: #f4f6f8;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
    }
    .subtitle {
      color: #6c757d;
      font-size: 0.875rem;
      margin: 0 0 2.25rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    li a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    li a:hover {
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      border-color: #c1c9d2;
    }
    .activity-icon {
      font-size: 1.75rem;
      flex-shrink: 0;
    }
    .activity-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .activity-meta {
      font-size: 0.8rem;
      color: #6c757d;
      margin-top: 0.125rem;
    }
  </style>
</head>
<body>
  <h1>Minhas Favoritas</h1>
  <p class="subtitle">Atividades pessoais — acesso por link direto.</p>
  <ul>
    <li>
      <a href="/favorites/maratona-do-rio-2026">
        <span class="activity-icon">🥇</span>
        <div>
          <div class="activity-name">Maratona do Rio 2026</div>
          <div class="activity-meta">Garmin Connect</div>
        </div>
      </a>
    </li>
  </ul>
</body>
</html>
