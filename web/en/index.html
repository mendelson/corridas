<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF6B35" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Next Race" />
  <meta name="description" content="Road races in Brazil – Brasília, national marathons and World Marathon Majors" />
  <link rel="icon" type="image/png" href="../logomendi-favicon.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../logomendi-favicon.png" />
  <title>Next Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-title">🏃 Next Race</span>
    <div class="header-actions">
      <a href="https://apps.mmendelson.com" target="_blank" rel="noopener"
         class="btn-apps" aria-label="Apps for Garmin">⌚ Apps</a>
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="de">DE</option>
      </select>
      <button class="btn-refresh" id="btnRefresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <div class="filters-bar" id="filtersBar">
    <!-- Text search -->
    <div class="filter-row filter-row-search">
      <input type="search" id="searchInput" class="search-input"
             placeholder="Search race..." aria-label="Search race" autocomplete="off" />
    </div>

    <!-- Distance filter -->
    <div class="filter-row" id="distanceFilter">
      <div class="filter-mode-toggle">
        <button class="mode-btn active" id="modeSelect" aria-pressed="true">Select</button>
        <button class="mode-btn" id="modeInterval" aria-pressed="false">Range</button>
      </div>
      <div id="pillsContainer" class="pills-container">
        <button class="pill" data-km="5" aria-pressed="false">5K</button>
        <button class="pill" data-km="10" aria-pressed="false">10K</button>
        <button class="pill" data-km="15" aria-pressed="false">15K</button>
        <button class="pill" data-km="21" aria-pressed="false">21K</button>
        <button class="pill" data-km="42" aria-pressed="false">42K</button>
        <button class="pill" data-km="outros" aria-pressed="false">Other</button>
      </div>
      <div id="intervalContainer" class="interval-container hidden">
        <label class="range-label">
          <span id="labelDistFrom">From</span>
          <input type="number" id="distMin" min="1" max="200" placeholder="km" aria-label="Minimum distance in km" />
        </label>
        <label class="range-label">
          <span id="labelDistTo">To</span>
          <input type="number" id="distMax" min="1" max="200" placeholder="km" aria-label="Maximum distance in km" />
        </label>
      </div>
    </div>

    <!-- Period + Location + Source -->
    <div class="filter-row filter-row-selects">
      <div class="select-wrapper">
        <select id="periodoSelect" aria-label="Filter by period">
          <option value="past15">Since 15 days ago</option>
          <option value="today">From today</option>
          <option value="30">Next 30 days</option>
          <option value="90">Next 3 months</option>
          <option value="180">Next 6 months</option>
          <option value="all">All time</option>
          <option value="custom">Custom range</option>
        </select>
      </div>
      <div class="estado-filter-wrapper" id="estadoFilterWrapper">
        <button class="estado-filter-btn" id="estadoFilterBtn"
                aria-haspopup="listbox" aria-expanded="false" aria-label="Filter by location">
          <span id="estadoFilterLabel">All</span>
          <span class="estado-filter-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="estado-filter-dropdown hidden" id="estadoFilterDropdown" role="listbox">
          <!-- populated dynamically -->
        </div>
      </div>
      <div class="fonte-filter-wrapper" id="fonteFilterWrapper">
        <button class="fonte-filter-btn" id="fonteFilterBtn"
                aria-haspopup="listbox" aria-expanded="false" aria-label="Filter by source">
          <span id="fonteFilterLabel">All sources</span>
          <span class="fonte-filter-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="fonte-filter-dropdown hidden" id="fonteFilterDropdown" role="listbox" aria-multiselectable="true">
          <!-- populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Custom date range (hidden by default) -->
    <div id="customDateRow" class="filter-row custom-date-row hidden">
      <label class="range-label">
        <span id="labelDateFrom">From</span>
        <input type="date" id="dateFrom" aria-label="Start date" />
      </label>
      <label class="range-label">
        <span id="labelDateTo">To</span>
        <input type="date" id="dateTo" aria-label="End date" />
      </label>
    </div>

    <!-- Results count + clear -->
    <div class="filter-row filter-meta">
      <span id="resultCount" class="result-count">Loading...</span>
      <button class="btn-clear hidden" id="btnClear" aria-label="Clear filters">Clear filters</button>
    </div>
  </div>

  <main id="cardsList" class="cards-list" role="list" aria-label="Race list"></main>

  <div id="emptyState" class="empty-state hidden">
    <p>No races found with current filters.</p>
    <button class="btn-clear" id="btnClearEmpty">Clear filters</button>
  </div>

  <template id="cardTemplate">
    <article class="card" role="listitem">
      <div class="card-collapsed" role="button" tabindex="0" aria-expanded="false">
        <div class="card-img-wrap">
          <img class="card-img" alt="" loading="lazy" />
          <div class="card-img-placeholder" aria-hidden="true"></div>
        </div>
        <div class="card-body">
          <div class="card-top">
            <h2 class="card-title"></h2>
          </div>
          <div class="card-meta">
            <span class="card-date"></span>
            <span class="card-location"></span>
          </div>
          <div class="card-footer">
            <div class="card-distances"></div>
            <span class="badge-fontes hidden"></span>
          </div>
        </div>
      </div>
      <div class="card-expanded hidden" aria-hidden="true">
        <div class="expanded-title hidden"></div>
        <div class="expanded-distances"></div>
        <div class="expanded-period"></div>
        <div class="expanded-fontes"></div>
        <div class="expanded-fotos"></div>
      </div>
    </article>
  </template>

  <script src="../app.js"></script>
</body>
</html>
