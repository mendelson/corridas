<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var bl = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
      if (bl.startsWith('pt')) { window.location.replace('/pt'); return; }
      if (bl.startsWith('es')) { window.location.replace('/es'); return; }
      if (bl.startsWith('de')) { window.location.replace('/de'); return; }
      if (bl.startsWith('fr')) { window.location.replace('/fr'); return; }
      window.location.replace('/en');
    }());
  </script>
</head>
<body></body>
</html>
